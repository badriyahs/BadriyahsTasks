<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badriyah's Tasks — Archive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=14">
</head>
<body>

<div class="topbar">
  <h1>Badriyah's Tasks</h1>
  <div class="sub"><span class="dot off" id="syncdot"></span><span id="syncstate">Connecting…</span></div>
  <div class="spacer"></div>
  <div class="undoredo">
    <button id="undobtn" title="Undo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
    <button id="redobtn" title="Redo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg></button>
  </div></div>

<div class="view" id="view-archive">
  <div class="toolbar">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchbox" type="text" placeholder="Search archived tasks…" autocomplete="off">
    </div>
    <div class="count" id="rowcount"></div>
  </div>
  <div class="sheet-scroll">
    <div class="sheet" id="sheet">
      <div class="row head">
        <div class="cell">No.</div>
        <div class="cell">Category</div>
        <div class="cell">Description</div>
        <div class="cell">Due Date</div>
        <div class="cell">Link</div>
        <div class="cell">Dependency</div>
        <div class="cell">Owner</div>
        <div class="cell">Details</div>
        <div class="cell"></div>
      </div>
      <!-- rows injected here -->
    </div>
  </div>
</div>

<div class="tabbar">
  <a class="tab" href="index.html">Tasks</a>
  <a class="tab" href="calendar.html">Calendar</a>
  <a class="tab active" href="archive.html">Archive</a>
  <a class="tab" href="activity.html">Activity</a>
  <a class="tab" href="reading.html">Reading</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="app.js?v=16"></script>
<script>
(function(){
  "use strict";
  var L = window.Ledger;
  L.wireTopbar();

  var els = {
    sheet: document.getElementById('sheet'),
    rowcount: document.getElementById('rowcount'),
    searchbox: document.getElementById('searchbox'),
    syncdot: document.getElementById('syncdot'),
    syncstate: document.getElementById('syncstate')
  };

  var search = '';
  var confirmDeleteId = null;

  L.onStatus(function(kind, text){
    els.syncdot.classList.remove('off','err');
    if(kind !== 'ok') els.syncdot.classList.add(kind);
    els.syncstate.textContent = text;
  });

  els.searchbox.addEventListener('input', function(){
    search = els.searchbox.value.trim().toLowerCase();
    render();
  });

  function matches(t){
    if(!search) return true;
    var hay = [t.no,t.category,t.description,t.owner,t.dependency,t.details,t.link].join(' ').toLowerCase();
    return hay.indexOf(search) !== -1;
  }

  function render(){
    var archived = L.state.tasks.filter(function(t){ return t.archived; });
    var visible = archived.filter(matches);
    els.rowcount.textContent = visible.length + (visible.length===1?' archived task':' archived tasks');

    var rowsHTML = visible.map(function(t){ return L.rowHTML(t, 'archived', confirmDeleteId); }).join('');
    var headHTML = els.sheet.querySelector('.row.head').outerHTML;
    L.preserveFocus(els.sheet, function(){
      els.sheet.innerHTML = headHTML + (rowsHTML || '<div class="empty-hint" style="grid-column:1/-1;">Nothing archived yet. Cross out a task from the Tasks tab to send it here.</div>');
    });
  }

  L.wireEditing(els.sheet);
  els.sheet.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action]');
    if(!btn) return;
    var action = btn.dataset.action, id = btn.dataset.id;
    if(action === 'restore'){ L.restoreTask(id); }
    else if(action === 'del'){
      confirmDeleteId = id;
      render();
      setTimeout(function(){
        if(confirmDeleteId === id){ confirmDeleteId = null; render(); }
      }, 3500);
    } else if(action === 'confirmdel'){
      L.deleteTask(id);
      confirmDeleteId = null;
    }
  });

  L.onChange(render);
})();
</script>
</body>
</html>
