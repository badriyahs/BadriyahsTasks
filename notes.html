<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badriyah's Tasks — Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=34">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.85em%27 font-size=%2290%27 text-anchor=%27middle%27 x=%2750%27>%E2%9C%A7</text></svg>">
</head>
<body>
<div class="tabbar">
  <a class="tab" href="index.html">Today</a>
  <a class="tab" href="tasks.html">Tasks</a>
  <a class="tab" href="calendar.html">Calendar</a>
  <a class="tab" href="archive.html">Archive</a>
  <a class="tab" href="activity.html">Activity</a>
  <a class="tab" href="reading.html">Reading</a>
  <a class="tab active" href="notes.html">Notes</a>
  <a class="tab" href="events.html">Events</a>
  <a class="tab" href="calls.html">Calls</a>
</div>

<div class="topbar">
  <h1>Badriyah's Tasks</h1>
  <div class="sub"><span class="dot off" id="syncdot"></span><span id="syncstate">Connecting…</span></div>
  <div class="spacer"></div>
  <div class="undoredo">
    <button id="undobtn" title="Undo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
    <button id="redobtn" title="Redo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg></button>
  </div>
</div>

<div class="view" id="view-notes">
  <div class="toolbar">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchbox" type="text" placeholder="Search notes…" autocomplete="off">
    </div>
    <div class="count" id="rowcount"></div>
  </div>
  <div class="notes-scroll">
    <div class="notes-grid" id="grid"></div>
  </div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="app.js?v=19"></script>
<script>
(function(){
  "use strict";
  var L = window.Ledger;
  L.wireTopbar();

  var els = {
    grid: document.getElementById('grid'),
    rowcount: document.getElementById('rowcount'),
    searchbox: document.getElementById('searchbox'),
    syncdot: document.getElementById('syncdot'),
    syncstate: document.getElementById('syncstate')
  };

  var search = '';

  L.onNotesStatus(function(kind, text){
    if(kind === 'err'){
      els.syncdot.classList.remove('off');
      els.syncdot.classList.add('err');
      els.syncstate.textContent = text;
    } else {
      els.syncdot.classList.remove('off','err');
      els.syncstate.textContent = 'Live — anyone with this link can edit';
    }
  });

  els.searchbox.addEventListener('input', function(){
    search = els.searchbox.value.trim().toLowerCase();
    render();
  });

  function render(){
    var items = L.notesState.items;
    var visible = search ? items.filter(function(n){ return n.text.toLowerCase().indexOf(search) !== -1; }) : items;
    els.rowcount.textContent = visible.length + (visible.length===1?' note':' notes');

    var cardsHTML = visible.map(L.noteCardHTML).join('');
    var addHTML = '<button class="addnotecard" id="addbtn">+ Add note</button>';
    L.preserveFocus(els.grid, function(){
      els.grid.innerHTML = cardsHTML + addHTML;
    });

    var btn = document.getElementById('addbtn');
    if(btn) btn.addEventListener('click', L.addNote);

    var focusId = L.focusNoteIdOnce();
    if(focusId){
      requestAnimationFrame(function(){
        var el = els.grid.querySelector('.note-text[data-id="'+focusId+'"]');
        if(el){ el.focus(); }
      });
    }
  }

  L.wireEditing(els.grid, L.updateNoteText);
  els.grid.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action="delnote"]');
    if(!btn) return;
    L.deleteNote(btn.dataset.id);
  });

  L.onNotesChange(render);
  render();
})();
</script>
</body>
</html>
