<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badriyah's Tasks — Jobs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=43">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.85em%27 font-size=%2290%27 text-anchor=%27middle%27 x=%2750%27>%E2%9C%A7</text></svg>">
<style>
:root{color-scheme:light dark;}
/* Scoped to .jobs so it can't touch the other pages. Colors come from the site's own variables. */
.jobs{--good:#2E7D4F;--good-tint:#E3F2E8;--warn:#A8591A;--warn-tint:#FBEEDF;}
@media (prefers-color-scheme: dark){
  .jobs{--good:#6FD39A;--good-tint:#16301F;--warn:#F0B270;--warn-tint:#33240F;}
}
.jobs-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.jobs .jwrap{max-width:1200px;margin:0 auto;padding:26px 20px calc(80px + env(safe-area-inset-bottom));}
.jobs h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:500;font-size:28px;margin:0 0 16px;letter-spacing:-.01em;}
.jobs .banner{background:var(--warn-tint);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px;margin:0 0 16px;line-height:1.5;}
.jobs .banner code{font-family:"IBM Plex Mono",monospace;font-size:12px;}
.jobs .hidden{display:none !important;}

.jobs .sheetwrap{overflow:auto;max-height:76vh;border:1px solid var(--line);border-radius:12px;background:var(--surface);}
.jobs table.jt{border-collapse:separate;border-spacing:0;min-width:1320px;width:100%;font-size:13.5px;}
.jobs .jt th{position:sticky;top:0;z-index:3;background:var(--surface);text-align:left;padding:10px;white-space:nowrap;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line-strong);border-right:1px solid var(--line);}
.jobs .jt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:middle;background:var(--surface);}
.jobs .jt .sn{position:sticky;left:0;z-index:2;width:250px;min-width:250px;box-shadow:1px 0 0 var(--line-strong);}
.jobs .jt th.sn{z-index:4;}
.jobs .jt td > input:not([type=checkbox]),.jobs .jt td > select{width:100%;border:0;background:transparent;font:inherit;color:var(--ink);padding:10px;border-radius:0;outline:0;min-width:0;}
.jobs .jt td > input:focus,.jobs .jt td > select:focus{background:var(--accent-tint);box-shadow:inset 0 0 0 2px var(--accent);}
.jobs .jt td:nth-child(2){min-width:230px;}
.jobs .jt td:nth-child(6){min-width:250px;}
.jobs .jt td:nth-child(7){min-width:220px;}
.jobs .jt td.cb{text-align:center;width:70px;}
.jobs .jt td.cb input{accent-color:var(--good);width:17px;height:17px;margin:0;cursor:pointer;vertical-align:middle;}
.jobs .jt .nm input{font-family:"IBM Plex Serif",serif;font-size:15px;}
.jobs .jt td.st{width:130px;}
.jobs .jt td.st select{font-weight:600;font-size:12.5px;}
.jobs .jt tr.s-applied td.st select,.jobs .jt tr.s-interview td.st select,.jobs .jt tr.s-offer td.st select{background:var(--good-tint);color:var(--good);}
.jobs .jt tr.s-closed td{opacity:.55;}
.jobs .jt tr:hover td,.jobs .jt tr:hover td.sn{background:var(--parent-tint);}
.jobs .viacell{display:flex;align-items:center;}
.jobs .viacell input{flex:1;width:100%;border:0;background:transparent;font:inherit;color:var(--ink);padding:10px;outline:0;min-width:0;}
.jobs .viacell input:focus{background:var(--accent-tint);box-shadow:inset 0 0 0 2px var(--accent);}
.jobs .viacell a{flex:none;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;padding:0 10px 0 2px;}
.jobs .jt td.x{width:64px;text-align:center;}
.jobs .jt td.x button{border:0;background:none;color:var(--faint);cursor:pointer;font:inherit;font-size:16px;padding:8px 10px;}
.jobs .jt td.x button:hover{color:var(--muted);}
.jobs .jt td.x button.confirm{font-size:11.5px;font-weight:600;color:#fff;background:#C0392B;border-radius:6px;padding:4px 8px;}
.jobs .addrow-btn{margin:12px 2px 0;border:1px solid var(--line-strong);background:transparent;color:var(--accent);font:inherit;font-weight:600;font-size:13px;border-radius:8px;padding:8px 14px;cursor:pointer;}
.jobs .addrow-btn:hover{background:var(--accent-tint);}
@media (max-width:700px){
  .jobs .jwrap{padding:18px 12px calc(70px + env(safe-area-inset-bottom));}
  .jobs h1{font-size:24px;}
  .jobs .jt .sn{width:160px;min-width:160px;}
  .jobs .jt td > input:not([type=checkbox]),.jobs .jt td > select,.jobs .viacell input{font-size:16px;}
}
</style>
</head>
<body>
<div class="tabbar">
  <a class="tab" href="index.html">Today</a>
  <a class="tab" href="tasks.html">Tasks</a>

  <a class="tab" href="archive.html">Archive</a>

  <a class="tab" href="events.html">Events</a>
  <a class="tab" href="calls.html">Calls</a>
  <a class="tab active" href="jobs.html">Jobs</a>
  <a class="tab" href="gre.html">GRE</a>
</div>

<div class="topbar">
  <h1>Badriyah's Tasks</h1>
  <div class="sub"><span class="dot off" id="syncdot"></span><span id="syncstate">Connecting…</span></div>
  <div class="spacer"></div>
</div>

<div class="jobs-scroll jobs">
<div class="jwrap">
  <h1>Job search</h1>
  <div class="banner hidden" id="rulebanner"></div>
  <div id="list"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  var STATUSES = [['idea','Not yet'],['applied','Applied'],['interview','Interview'],['offer','Offer'],['closed','Closed']];
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyD5Enp6XOf64EEBnjDf6A2NsKxG_GTW36M",
    authDomain: "badriyahstasks.firebaseapp.com",
    projectId: "badriyahstasks",
    storageBucket: "badriyahstasks.firebasestorage.app",
    messagingSenderId: "97057321631",
    appId: "1:97057321631:web:fa339e1352631ecb9d68aa"
  };

  var LS_KEY = 'badriyah-jobs-v1';
  var state = {items: {}, mode: 'connecting'};
  var db = null, col = null, confirmDel = null, pendingFocus = null;
  var listEl = document.getElementById('list');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
  function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify({items: state.items, settings: {}})); } catch(e){} }
  function newDoc(order){ return {name: '', role: '', stage: 'idea', cvDone: false, portfolioDone: false, applyVia: '', notes: '', order: order}; }
  function list(){
    return Object.keys(state.items).map(function(id){ return Object.assign({id: id}, state.items[id]); })
      .sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
  }
  // Older rows used more stages; show them under the simple ones.
  function status(c){ var s = c.stage; return (s === 'researching' || s === 'tailoring' || !s) ? 'idea' : s; }

  // ---------- storage (Firestore "jobs", or this browser until its rule is published) ----------
  function showBanner(reason){
    var b = document.getElementById('rulebanner');
    b.innerHTML = 'Saving in this browser only (' + esc(reason) + '). To keep this on all your devices, add this rule in the Firebase console and publish: <code>match /jobs/{id} { allow read, write: if true; }</code>';
    b.classList.remove('hidden');
  }
  function write(id, patch){
    state.items[id] = Object.assign(state.items[id] || {}, patch);
    if(state.mode === 'cloud') col.doc(id).set(patch, {merge: true}).catch(function(e){ console.error(e); });
    else lsSave();
    render();
  }
  function addBlank(){
    var max = list().reduce(function(m, c){ return Math.max(m, c.order || 0); }, 0);
    var doc = newDoc(max + 10);
    if(state.mode === 'cloud'){
      col.add(doc).then(function(ref){ pendingFocus = ref.id; render(); }).catch(function(e){ console.error(e); });
    } else {
      var id = 'j' + Date.now(); state.items[id] = doc; lsSave(); pendingFocus = id; render();
    }
  }
  function removeRow(id){
    delete state.items[id];
    if(state.mode === 'cloud') col.doc(id).delete().catch(function(e){ console.error(e); }); else lsSave();
    render();
  }
  function startLocal(reason){
    state.mode = 'local';
    var saved = lsLoad();
    if(saved) state.items = saved.items || {};
    if(reason) showBanner(reason);
    render();
  }
  function startCloud(){
    try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); col = db.collection('jobs'); }
    catch(e){ startLocal('Firebase unavailable'); return; }
    var first = true;
    col.onSnapshot(function(snap){
      var items = {};
      snap.docs.forEach(function(d){ if(d.id !== '_settings') items[d.id] = d.data(); });
      if(first){
        first = false;
        state.mode = 'cloud';
        document.getElementById('rulebanner').classList.add('hidden');
        var saved = lsLoad();
        if(!Object.keys(items).length && saved && saved.items && Object.keys(saved.items).length){
          var batch = db.batch();   // carry over anything saved here before the rule existed
          Object.keys(saved.items).forEach(function(id){ batch.set(col.doc(), saved.items[id]); });
          batch.commit().then(function(){ try { localStorage.removeItem(LS_KEY); } catch(e){} });
          return;
        }
      }
      state.items = items;
      render();
    }, function(err){
      if(state.mode !== 'local') startLocal(err && err.code === 'permission-denied' ? 'the database rule isn’t published yet' : 'offline');
    });
  }

  // ---------- render ----------
  function applyLink(v){
    v = String(v || '').trim();
    if(/^https?:\/\//i.test(v)) return '<a href="' + esc(v) + '" target="_blank" rel="noopener noreferrer">Open ↗</a>';
    if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return '<a href="mailto:' + esc(v) + '">Email ↗</a>';
    return '';
  }
  function rowHTML(c){
    var st = status(c);
    return '<tr class="s-' + st + '" data-id="' + c.id + '">' +
      '<td class="sn nm"><input type="text" data-field="name" value="' + esc(c.name) + '" placeholder="Company"></td>' +
      '<td><input type="text" data-field="role" value="' + esc(c.role) + '" placeholder="Role"></td>' +
      '<td class="st"><select data-field="stage">' + STATUSES.map(function(s){ return '<option value="' + s[0] + '"' + (s[0] === st ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select></td>' +
      '<td class="cb"><input type="checkbox" data-field="cvDone"' + (c.cvDone ? ' checked' : '') + ' aria-label="CV done"></td>' +
      '<td class="cb"><input type="checkbox" data-field="portfolioDone"' + (c.portfolioDone ? ' checked' : '') + ' aria-label="Portfolio done"></td>' +
      '<td><div class="viacell"><input type="text" data-field="applyVia" value="' + esc(c.applyVia) + '" placeholder="Email or link">' + applyLink(c.applyVia) + '</div></td>' +
      '<td><input type="text" data-field="notes" value="' + esc(c.notes) + '" placeholder="Notes"></td>' +
      '<td class="x">' + (confirmDel === c.id ? '<button type="button" class="confirm" data-act="confirmdel">Delete?</button>' : '<button type="button" data-act="del" aria-label="Delete row">×</button>') + '</td>' +
      '</tr>';
  }
  function render(){
    var dot = document.getElementById('syncdot'), st = document.getElementById('syncstate');
    dot.className = 'dot' + (state.mode === 'connecting' ? ' off' : '');
    st.textContent = state.mode === 'cloud' ? 'Live — anyone with this link can edit' : state.mode === 'local' ? 'Saved in this browser only' : 'Connecting…';
    var ae = document.activeElement;
    if(ae && listEl.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) return; // never redraw under the cursor
    listEl.innerHTML = '<div class="sheetwrap"><table class="jt"><thead><tr><th class="sn">Company</th><th>Role</th><th>Status</th><th>CV</th><th>Portfolio</th><th>Email or link</th><th>Notes</th><th></th></tr></thead><tbody>' +
      list().map(rowHTML).join('') + '</tbody></table></div><button class="addrow-btn" type="button" data-act="addrow">+ Add a row</button>';
    if(pendingFocus){
      var pf = listEl.querySelector('tr[data-id="' + pendingFocus + '"] input[data-field="name"]');
      if(pf){ pf.focus(); pendingFocus = null; }
    }
  }

  listEl.addEventListener('change', function(e){
    var el = e.target, row = el.closest('tr[data-id]'); if(!row) return;
    var f = el.dataset.field; if(!f) return;
    var patch = {};
    patch[f] = el.type === 'checkbox' ? el.checked : el.value.trim();
    write(row.dataset.id, patch);
  });
  listEl.addEventListener('click', function(e){
    var b = e.target.closest('button[data-act]'); if(!b) return;
    var row = b.closest('tr[data-id]'), id = row ? row.dataset.id : null;
    if(b.dataset.act === 'addrow') addBlank();
    else if(b.dataset.act === 'del'){
      confirmDel = id; render();
      setTimeout(function(){ if(confirmDel === id){ confirmDel = null; render(); } }, 3500);
    } else if(b.dataset.act === 'confirmdel'){ confirmDel = null; removeRow(id); }
  });
  listEl.addEventListener('focusout', function(){
    setTimeout(function(){ var a = document.activeElement; if(!a || !listEl.contains(a)) render(); }, 0);
  });

  if(window.firebase){
    startCloud();
    setTimeout(function(){ if(state.mode === 'connecting') startLocal('offline'); }, 8000);
  } else { startLocal(''); }
})();
</script>
</body>
</html>
