<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Badriyah's Tasks — Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap">

<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
<div class="tabbar">
  <a class="tab" href="index.html">Today</a>
  <a class="tab" href="tasks.html">Tasks</a>
  <a class="tab active" href="calendar.html">Calendar</a>
  <a class="tab" href="archive.html">Archive</a>
  <a class="tab" href="activity.html">Activity</a>
  <a class="tab" href="reading.html">Library</a>
  <a class="tab" href="notes.html">Notes</a>
  <a class="tab" href="events.html">Events</a>

<div class="topbar">
  <h1>Badriyah's Tasks</h1>
  <div class="sub"><span class="dot off" id="syncdot"></span><span id="syncstate">Connecting…</span></div>
  <div class="spacer"></div>
  <div class="undoredo">
    <button id="undobtn" title="Undo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
    <button id="redobtn" title="Redo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg></button>
  </div></div>

<div class="view" id="view-cal">
  <div class="cal-scroll">
    <section class="wkview" id="wkview" aria-label="This week"></section>
    <div class="calnav">
      <button class="navbtn" id="calprev" aria-label="Previous month">‹</button>
      <button class="navbtn" id="calnext" aria-label="Next month">›</button>
      <h2 id="calmonth"></h2>
      <button class="todaybtn" id="caltoday">Today</button>
      <div class="legend" id="callegend"></div>
    </div>
    <div class="calgrid" id="calgrid"></div>
  </div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="app.js?v=24"></script>
<script>
(function(){
  "use strict";
  var L = window.Ledger;
  L.wireTopbar();

  var els = {
    calgrid: document.getElementById('calgrid'),
    calmonth: document.getElementById('calmonth'),
    callegend: document.getElementById('callegend'),
    syncdot: document.getElementById('syncdot'),
    syncstate: document.getElementById('syncstate')
  };

  var calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  var expandedDays = {};

  L.onStatus(function(kind, text){
    els.syncdot.classList.remove('off','err');
    if(kind !== 'ok') els.syncdot.classList.add(kind);
    els.syncstate.textContent = text;
  });

  document.getElementById('calprev').addEventListener('click', function(){
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1);
    render();
  });
  document.getElementById('calnext').addEventListener('click', function(){
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1);
    render();
  });
  document.getElementById('caltoday').addEventListener('click', function(){
    var n = new Date();
    calMonth = new Date(n.getFullYear(), n.getMonth(), 1);
    render();
  });

  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  /* Tasks and Events are two independent stores (separate Firestore
     collections, separate numbering) — merge them here for display only.
     Each item is tagged with which store it came from so its section
     color/title can be looked up in the right place. Calls (deadlines
     from the Calls tab) are flat, not hierarchical, so they're merged
     separately and excluded from the section legend. */
  function storeFor(t){ return t._store === 'events' ? L.Events : L; }
  function sectionItems(){
    var tasks = L.state.tasks.filter(function(t){ return !t.archived; }).map(function(t){ t._store='tasks'; return t; });
    var events = L.Events.state.tasks.filter(function(t){ return !t.archived; }).map(function(t){ t._store='events'; return t; });
    return tasks.concat(events);
  }
  function callItems(){
    return L.callsState.items.filter(function(c){ return c.deadline; }).map(function(c){
      return { id:c.id, due:c.deadline, description:c.name, category:c.category, mine:c.mine, no:'', _store:'calls' };
    });
  }
  function activeItems(){
    return sectionItems().concat(callItems());
  }

  function eventsByDate(){
    var map = {};
    activeItems().forEach(function(t){
      if(!t.due) return;
      (map[t.due] = map[t.due] || []).push(t);
    });
    return map;
  }

  function chipFor(t){
        if(t._store === 'calls'){
          var cs = t.mine === 'skip' ? {bg:'var(--archived-tint)', fg:'var(--faint)'} : L.catClassStyle(t.category);
          var clabel = '<span class="evt-mark">◆</span>' + L.escapeHTML(t.description||'Untitled');
          var ctip = 'Call — ' + (t.description||'');
          return '<button class="evt is-call" data-goto="'+t.id+'" data-goto-store="calls" style="background:'+cs.bg+';color:'+cs.fg+'" title="'+L.escapeHTML(ctip)+'">'+clabel+'</button>';
        }
        var store = storeFor(t);
        var isEvent = t._store === 'events';
        var s = t.struck ? {bg:'var(--archived-tint)', fg:'var(--faint)'} : store.sectionColor(t.no);
        var depth = L.depthOf(t.no);
        var prefix = depth>0 ? (store.ancestorTitle(t.no)||'').toUpperCase() : '';
        var mark = isEvent ? '<span class="evt-mark">✦</span>' : '';
        var label = mark + (prefix?'<b>'+L.escapeHTML(prefix)+':</b> ':'') + (t.no?('<span class="no">'+L.escapeHTML(t.no)+'</span>'):'') + L.escapeHTML(t.description||'Untitled');
        var tip = (isEvent?'Event — ':'') + (prefix?prefix+' — ':'') + (t.description||'');
        return '<button class="evt'+(t.struck?' struck':'')+(isEvent?' is-event':'')+'" data-goto="'+t.id+'" data-goto-store="'+t._store+'" style="background:'+s.bg+';color:'+s.fg+'" title="'+L.escapeHTML(tip)+'">'+label+'</button>';
        }

  function renderLegend(){
    var seen = {}, items = [];
    sectionItems().forEach(function(t){
      if(!t.due) return;
      var store = storeFor(t);
      var seg = L.topSegment(t.no);
      var key = t._store + ':' + seg;
      if(seen[key]) return;
      seen[key] = true;
      items.push({seg:seg, store:store, title:store.ancestorTitle(t.no) || seg, isEvent: t._store==='events'});
    });
    els.callegend.innerHTML = items.map(function(it){
      var s = it.store.sectionColor(it.seg);
      return '<span class="tag'+(it.isEvent?' is-event':'')+'" style="background:'+s.bg+';color:'+s.fg+'">'+(it.isEvent?'✦ ':'')+L.escapeHTML(it.title)+'</span>';
    }).join('');
  }


  // ---------- week schedule: all-day things, then Morning / Afternoon / Evening / Night ----------
  var weekOffset = 0, healthPlan = {}, greItems = [], wkExpanded = {};
  var SLOT_ROWS = [['m', 'Morning'], ['a', 'Afternoon'], ['e', 'Evening'], ['n', 'Night']];
  var HEALTH_LABEL = L.HEALTH_WORDS;
  // The week starts on Monday, to match the month grid below it.
  function weekIsos(offset){
    var now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) + offset * 7), out = [];
    for(var i = 0; i < 7; i++){ out.push(L.fmtISO(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i))); }
    return out;
  }
  var slotFromText = L.slotFromText;
  function renderWeek(){
    var el = document.getElementById('wkview'); if(!el) return;
    var days = weekIsos(weekOffset), todayStr = L.todayISO(), evMap = eventsByDate();
    var f = parseISODate(days[0]), l = parseISODate(days[6]);
    var mo = function(d){ return MONTH_NAMES[d.getMonth()].slice(0, 3); };
    var label = weekOffset === 0 ? 'This week' : (mo(f) + ' ' + f.getDate() + ' to ' + (mo(l) !== mo(f) ? mo(l) + ' ' : '') + l.getDate());
    var html = '<div class="wk-head"><button type="button" class="navbtn" data-wk="-1" aria-label="Previous week">‹</button>' +
      '<div class="wk-title"><b>' + label + '</b><span>' + mo(f) + ' ' + f.getDate() + ' – ' + mo(l) + ' ' + l.getDate() + '</span></div>' +
      '<button type="button" class="navbtn" data-wk="1" aria-label="Next week">›</button>' +
      (weekOffset !== 0 ? '<button type="button" class="todaybtn" data-wk="0">This week</button>' : '') + '</div>';
    html += '<div class="wk-scroll"><div class="wk-grid"><div class="wk-corner"></div>';
    days.forEach(function(iso){
      var d = parseISODate(iso);
      html += '<div class="wk-dh' + (iso === todayStr ? ' now' : '') + '"><span>' + DAY_NAMES[(d.getDay() + 6) % 7] + '</span><b>' + d.getDate() + '</b></div>';
    });
    // all-day row
    html += '<div class="wk-rl all">All day</div>';
    days.forEach(function(iso){
      var d = parseISODate(iso), items = [], greOn = greItems.filter(function(g){ return g.date === iso; });
      (evMap[iso] || []).forEach(function(t){ if(t._store === 'events' && slotFromText(t.details)) return; items.push(chipFor(t)); });
      if(greOn.length) items.unshift('<a class="evt wk-gre" href="gre.html" title="' + L.escapeHTML(greOn.map(function(g){ return g.title; }).join(' · ')) + '">GRE · ' + L.escapeHTML(greOn[0].title) + (greOn.length > 1 ? ' +' + (greOn.length - 1) : '') + '</a>');
      var open = wkExpanded[iso], shown = open ? items : items.slice(0, 3), extra = items.length - shown.length;
      html += '<div class="wk-cell all' + (iso === todayStr ? ' now' : '') + '">' + shown.join('') +
        (extra > 0 ? '<button type="button" class="more" data-wkmore="' + iso + '">+' + extra + ' more</button>' : (open && items.length > 3 ? '<button type="button" class="more" data-wkless="' + iso + '">Show less</button>' : '')) + '</div>';
    });
    // time-of-day rows: planned health things (from the Health tab) and timed events
    SLOT_ROWS.forEach(function(sr){
      html += '<div class="wk-rl ' + sr[0] + '">' + sr[1] + '</div>';
      days.forEach(function(iso){
        var d = parseISODate(iso), codes = (((healthPlan[d.getDay()] || {})[sr[0]]) || ''), chips = '';
        (evMap[iso] || []).forEach(function(t){ if(t._store === 'events' && slotFromText(t.details) === sr[0]) chips += chipFor(t); });
        var dots = codes.split('').filter(Boolean).map(function(c){ return HEALTH_LABEL[c] ? '<a class="wk-h ' + c + '" href="' + (c === 'p' ? 'https://studiosweat.co/mansouriya" target="_blank" rel="noopener' : 'health.html') + '">' + HEALTH_LABEL[c] + '</a>' : ''; }).join('');
        html += '<div class="wk-cell' + (iso === todayStr ? ' now' : '') + '">' + chips + (dots ? '<div class="wk-hs">' + dots + '</div>' : '') + '</div>';
      });
    });
    html += '</div></div><div class="wk-legend">Pilates, supplements, walks and bedtime come from your plan on the <a href="health.html">Health tab</a>.</div>';
    var prevScroll = el.querySelector('.wk-scroll'), keepLeft = prevScroll ? prevScroll.scrollLeft : null;
    el.innerHTML = html;
    var sc = el.querySelector('.wk-scroll'), nowCol = el.querySelector('.wk-dh.now');
    if(sc){
      if(keepLeft !== null) sc.scrollLeft = keepLeft;
      else if(nowCol) sc.scrollLeft = Math.max(0, nowCol.offsetLeft - 64 - 48);   // first open: today in view, with a day of context
    }
    el.querySelectorAll('[data-wk]').forEach(function(b){
      b.addEventListener('click', function(){ var v = +b.dataset.wk; weekOffset = v === 0 ? 0 : weekOffset + v; renderWeek(); });
    });
    el.querySelectorAll('[data-wkmore]').forEach(function(b){ b.addEventListener('click', function(){ wkExpanded[b.dataset.wkmore] = true; renderWeek(); }); });
    el.querySelectorAll('[data-wkless]').forEach(function(b){ b.addEventListener('click', function(){ delete wkExpanded[b.dataset.wkless]; renderWeek(); }); });
    bindGoto(el);
  }
  function parseISODate(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function bindGoto(root){
    root.querySelectorAll('[data-goto]').forEach(function(el){
      el.addEventListener('click', function(){
        var store = el.dataset.gotoStore;
        var page = store === 'events' ? 'events.html' : (store === 'calls' ? 'calls.html' : 'tasks.html');
        var prefix = store === 'calls' ? 'call-' : 'task-';
        window.location.href = page + '#' + prefix + el.dataset.goto;
      });
    });
  }
  // The Health plan and the GRE chapters live in their own collections.
  try {
    var fsdb = firebase.firestore();
    fsdb.collection('health').doc('_settings').onSnapshot(function(doc){
      var pj = doc.exists ? doc.data().planJson : ''; try { healthPlan = pj ? JSON.parse(pj) : {}; } catch(e){ healthPlan = {}; }
      renderWeek();
    }, function(){ healthPlan = {}; try { var sv = JSON.parse(localStorage.getItem('badriyah-health-v1') || 'null'); healthPlan = sv && sv.goals && sv.goals.planJson ? JSON.parse(sv.goals.planJson) : {}; } catch(e){} renderWeek(); });
    fsdb.collection('gre').onSnapshot(function(snap){
      greItems = snap.docs.filter(function(d){ return d.id !== '_settings'; }).map(function(d){ return Object.assign({id: d.id}, d.data()); })
        .filter(function(g){ var once = g.id.indexOf('dx-') === 0 || g.id.indexOf('rev-') === 0; return g.date && !(once ? g.done : g.study); });
      greItems.sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
      renderWeek();
    }, function(){ greItems = []; renderWeek(); });
  } catch(e){}

  function render(){
    renderWeek();
    var y = calMonth.getFullYear(), m = calMonth.getMonth();
    els.calmonth.textContent = MONTH_NAMES[m] + ' ' + y;
    renderLegend();

    var first = new Date(y, m, 1);
    var startOffset = (first.getDay() + 6) % 7;
    var gridStart = new Date(y, m, 1 - startOffset);
    var todayStr = L.todayISO();
    var evMap = eventsByDate();

    var html = DAY_NAMES.map(function(d){ return '<div class="calhead">'+d+'</div>'; }).join('');

    for(var i=0;i<42;i++){
      var d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
      var iso = L.fmtISO(d);
      var outside = d.getMonth() !== m;
      var isToday = iso === todayStr;
      var dayEvents = evMap[iso] || [];
      var expanded = !!expandedDays[iso];
      var visibleEvents = expanded ? dayEvents : dayEvents.slice(0,3);
      var extra = dayEvents.length - visibleEvents.length;

      var chipsHTML = visibleEvents.map(chipFor).join('');
      var moreHTML = extra>0 ? '<button class="more" data-expand="'+iso+'">+'+extra+' more</button>' : (expanded && dayEvents.length>3 ? '<button class="more" data-collapse="'+iso+'">Show less</button>' : '');

      html += '<div class="day'+(outside?' outside':'')+(isToday?' today':'')+'">' +
        '<div class="daynum">'+d.getDate()+(isToday?'<span class="todaypill">Today</span>':'')+'</div>' +
        chipsHTML + moreHTML +
        '</div>';
    }

    els.calgrid.innerHTML = html;

    bindGoto(els.calgrid);
    els.calgrid.querySelectorAll('[data-expand]').forEach(function(el){
      el.addEventListener('click', function(){ expandedDays[el.dataset.expand]=true; render(); });
    });
    els.calgrid.querySelectorAll('[data-collapse]').forEach(function(el){
      el.addEventListener('click', function(){ delete expandedDays[el.dataset.collapse]; render(); });
    });
  }

  L.onChange(render);
  L.Events.onChange(render);
  L.onCallsChange(render);
})();
</script>
<script>(function(){var a=document.querySelector('.tab.active');if(a&&a.parentNode){a.parentNode.scrollLeft=Math.max(0,a.offsetLeft-16);}})();</script>
<script src="nav.js?v=1"></script>
</body>
