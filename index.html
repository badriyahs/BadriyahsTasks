<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="app.js?v=19"></script>
<script>
(function(){
  "use strict";
  var L = window.Ledger;

  var els = {
    date: document.getElementById('digestdate'),
    syncdot: document.getElementById('syncdot'),
    syncstate: document.getElementById('syncstate'),
    dua: document.getElementById('duabox'),
    days: document.getElementById('homedays')
  };

  els.date.textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});

  L.onStatus(function(kind, text){
    els.syncdot.classList.remove('off','err');
    if(kind !== 'ok') els.syncdot.classList.add(kind);
    els.syncstate.textContent = text;
  });

  function dayOfYear(){
    var now = new Date();
    var start = new Date(now.getFullYear(), 0, 0);
    return Math.floor((now - start) / 86400000);
  }
  function pickRotating(list, n){
    if(!list.length) return [];
    var start = dayOfYear() % list.length;
    var out = [];
    for(var i=0; i<Math.min(n, list.length); i++){ out.push(list[(start+i) % list.length]); }
    return out;
  }

  /* A short set of du'as (with hadith citations) from "أدعية النبي صلى الله
     عليه وسلم", compiled by Sheikh ʿAbd al-Muḥsin al-ʿAbbād
     (nuqayah.com/f/abbad.pdf) — the shorter, clearly-legible ones, chosen
     to transcribe accurately. One rotates in per day. */
  var DUAS = [
    { ar: 'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ', src: 'سيد الاستغفار — رواه البخاري (٦٣٠٦) عن شداد بن أوس رضي الله عنه' },
    { ar: 'اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ', src: 'رواه البخاري (٨٣٤) ومسلم (٦٨٦٩) عن أبي بكر رضي الله عنه' },
    { ar: 'اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ، وَجِلَّهُ، وَأَوَّلَهُ، وَآخِرَهُ، وَعَلَانِيَتَهُ، وَسِرَّهُ', src: 'رواه مسلم (١٠٨٤) عن أبي هريرة رضي الله عنه' },
    { ar: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ وَمِنْ شَرِّ مَا لَمْ أَعْمَلْ', src: 'رواه مسلم (٦٨٩٥) عن عائشة رضي الله عنها' },
    { ar: 'اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ', src: 'رواه مسلم (٦٩٠٣) عن أبي هريرة رضي الله عنه' },
    { ar: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى', src: 'رواه مسلم (٦٩٠٤) عن ابن مسعود رضي الله عنه' },
    { ar: 'اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ', src: 'رواه مسلم (٦٧٥٠) عن عبد الله بن عمرو رضي الله عنهما' },
    { ar: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ وَتَحَوُّلِ عَافِيَتِكَ وَفُجَاءَةِ نِقْمَتِكَ وَجَمِيعِ سَخَطِكَ', src: 'رواه مسلم (٦٩٤٣) عن ابن عمر رضي الله عنهما' },
    { ar: 'اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ', src: 'رواه الترمذي (٣٣٩٢) وغيره بإسناد صحيح عن أبي هريرة رضي الله عنه' },
    { ar: 'اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ', src: 'رواه الترمذي (٣٥٦٣) بإسناد حسن عن علي، وانظر السلسلة الصحيحة للألباني (٢٦٦)' }
  ];

  function renderDua(){
    var d = pickRotating(DUAS, 1)[0];
    if(!d){ els.dua.innerHTML = ''; return; }
    els.dua.innerHTML =
      '<div class="dua-ar" lang="ar" dir="rtl">' + d.ar + '</div>' +
      '<div class="dua-src" lang="ar" dir="rtl">' + d.src + '</div>';
  }

  function isPending(t){ return !!(t.dependency && t.dependency.trim()); }

  /* "Today" / "Tomorrow" / "N days ago" bucket for a given ISO date,
     relative to today — each overdue date gets its own bucket (not one
     lumped "Overdue") so the exact lateness is always visible in the
     header itself. */
  function dayInfo(iso, todayISO){
    var d = new Date(iso + 'T00:00:00');
    var today = new Date(todayISO + 'T00:00:00');
    var diff = Math.round((d - today) / 86400000);
    var dateStr = d.toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'});
    var label;
    if(diff === 0) label = 'Today';
    else if(diff === 1) label = 'Tomorrow';
    else if(diff === -1) label = dateStr + ' · Yesterday';
    else if(diff < -1) label = dateStr + ' · ' + Math.abs(diff) + ' days ago';
    else label = dateStr;
    return {label: label, diff: diff};
  }

  function render(){
    renderDua();

    var todayStr = L.todayISO();
    var horizon = new Date(todayStr + 'T00:00:00');
    horizon.setDate(horizon.getDate() + 6);
    var horizonStr = L.fmtISO(horizon);

    var buckets = {}; // label -> {order, diff, items:[]}
    function pushItem(dateKey, order, item){
      var label, diff;
      if(dateKey === 'reading'){ label = 'Worth a Read'; diff = 9999; }
      else { var info = dayInfo(dateKey, todayStr); label = info.label; diff = info.diff; }
      if(!buckets[label]) buckets[label] = {order: dateKey === 'reading' ? 9999 : order, diff: diff, items: []};
      buckets[label].items.push(item);
    }

    L.state.tasks.filter(function(t){
      return !t.archived && !t.struck && t.due && t.due <= horizonStr;
    }).forEach(function(t){
      var overdue = t.due < todayStr;
      var pending = overdue && isPending(t);
      pushItem(t.due, t.due, {
        href: 'tasks.html#task-' + t.id,
        text: t.description || 'Untitled',
        meta: pending ? ('Pending · ' + t.dependency) : '',
        cls: pending ? 'is-pending' : (overdue ? 'is-overdue' : '')
      });
    });

    L.Events.state.tasks.filter(function(t){
      return !t.archived && !t.struck && t.due && t.due >= todayStr && t.due <= horizonStr;
    }).forEach(function(t){
      pushItem(t.due, t.due, {
        href: 'events.html#task-' + t.id,
        text: t.description || 'Untitled',
        meta: t.details || '',
        cls: 'is-event'
      });
    });

    L.callsState.items.filter(function(c){
      if(c.status === 'watch' || c.mine === 'skip') return false;
      var d = L.daysUntil(c.deadline);
      return d !== null && d >= 0 && d <= 6;
    }).forEach(function(c){
      var d = L.daysUntil(c.deadline);
      pushItem(c.deadline, c.deadline, {
        href: 'calls.html#call-' + c.id,
        text: c.name,
        meta: d === 0 ? 'Today' : (d + 'd left'),
        cls: 'is-call'
      });
    });

    var pool = L.readingState.items.filter(function(r){ return r.title && r.status !== 'finished'; });
    var pick = pickRotating(pool, 1)[0];
    if(pick){
      pushItem('reading', 9999, {
        href: 'reading.html#task-' + pick.id,
        text: pick.title,
        meta: pick.author || '',
        cls: 'is-reading'
      });
    }

    var labels = Object.keys(buckets).sort(function(a,b){ return buckets[a].order < buckets[b].order ? -1 : 1; });

    if(!labels.length){
      els.days.innerHTML = '<div class="home-empty">A quiet few days ahead.</div>';
      return;
    }

    els.days.innerHTML = labels.map(function(label){
      var b = buckets[label];
      var late = b.diff < 0 && b.diff > -9000;
      /* The further overdue a bucket's date, the bigger/more intense its
         timeline node — a quick-glance read of "how overdue" beyond the
         day count in the header. */
      var sev = late ? Math.min(1, Math.abs(b.diff) / 21) : 0;
      var nodeStyle = late
        ? 'style="width:' + (8 + sev*7).toFixed(0) + 'px;height:' + (8 + sev*7).toFixed(0) + 'px;background:var(--overdue);border-color:var(--overdue);opacity:' + (0.55 + sev*0.45).toFixed(2) + '"'
        : '';
      return '<div class="day-group' + (late ? ' is-late' : '') + '">' +
        '<div class="day-group-label"><span class="day-node" ' + nodeStyle + '></span>' + L.escapeHTML(label) + '</div>' +
        b.items.map(function(it){
          return '<a class="day-item ' + it.cls + '" href="' + it.href + '">' +
            '<span class="day-item-dot"></span>' +
            '<span class="day-item-text">' + L.escapeHTML(it.text) +
            (it.meta ? '<span class="day-item-meta">' + L.escapeHTML(it.meta) + '</span>' : '') +
            '</span>' +
            '</a>';
        }).join('') +
        '</div>';
    }).join('');
  }

  L.onChange(render);
  L.Events.onChange(render);
  L.onCallsChange(render);
  L.onReadingChange(render);
})();
</script>
