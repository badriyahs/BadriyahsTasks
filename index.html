      <div class="home-head">
        <div class="home-greeting" id="greet" lang="ar" dir="rtl">صباح الخير بدرية</div>
        <script>(function(){var h=new Date().getHours(),g=document.getElementById('greet');if(g)g.textContent=h>=5&&h<12?'صباح الخير بدرية':h>=12&&h<21?'مساء الخير بدرية':'تصبحين على خير يا بدرية';})();</script>

<script>
(function(){
  "use strict";
  var L = window.Ledger;

  var els = {
    date: document.getElementById('digestdate'),
    syncdot: document.getElementById('syncdot'),
    syncstate: document.getElementById('syncstate'),
    dua: document.getElementById('duabox')
  };

  els.date.textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});

  L.onStatus(function(kind, text){
    els.syncdot.classList.remove('off','err');
    if(kind !== 'ok') els.syncdot.classList.add(kind);
    els.syncstate.textContent = text;
  });

  function dayOfYear(){
    var now = new Date();
    var start = new Date(now.getFullYear(), 0, 0);
    return Math.floor((now - start) / 86400000);
  }
  function pickRotating(list, n){
    if(!list.length) return [];
    var start = dayOfYear() % list.length;
    var out = [];
    for(var i=0; i<Math.min(n, list.length); i++){ out.push(list[(start+i) % list.length]); }
    return out;
  }

  /* A short set of du'as (with hadith citations) from "أدعية النبي صلى الله
     عليه وسلم", compiled by Sheikh ʿAbd al-Muḥsin al-ʿAbbād
     (nuqayah.com/f/abbad.pdf) — the shorter, clearly-legible ones, chosen
     to transcribe accurately. One rotates in per day. */
  var DUAS = [
    { ar: 'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ', src: 'سيد الاستغفار — رواه البخاري (٦٣٠٦) عن شداد بن أوس رضي الله عنه' },
    { ar: 'اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ', src: 'رواه البخاري (٨٣٤) ومسلم (٦٨٦٩) عن أبي بكر رضي الله عنه' },
    { ar: 'اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ، وَجِلَّهُ، وَأَوَّلَهُ، وَآخِرَهُ، وَعَلَانِيَتَهُ، وَسِرَّهُ', src: 'رواه مسلم (١٠٨٤) عن أبي هريرة رضي الله عنه' },
    { ar: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ وَمِنْ شَرِّ مَا لَمْ أَعْمَلْ', src: 'رواه مسلم (٦٨٩٥) عن عائشة رضي الله عنها' },
    { ar: 'اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ', src: 'رواه مسلم (٦٩٠٣) عن أبي هريرة رضي الله عنه' },
    { ar: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى', src: 'رواه مسلم (٦٩٠٤) عن ابن مسعود رضي الله عنه' },
    { ar: 'اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ', src: 'رواه مسلم (٦٧٥٠) عن عبد الله بن عمرو رضي الله عنهما' },
    { ar: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ وَتَحَوُّلِ عَافِيَتِكَ وَفُجَاءَةِ نِقْمَتِكَ وَجَمِيعِ سَخَطِكَ', src: 'رواه مسلم (٦٩٤٣) عن ابن عمر رضي الله عنهما' },
    { ar: 'اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ', src: 'رواه الترمذي (٣٣٩٢) وغيره بإسناد صحيح عن أبي هريرة رضي الله عنه' },
    { ar: 'اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ', src: 'رواه الترمذي (٣٥٦٣) بإسناد حسن عن علي، وانظر السلسلة الصحيحة للألباني (٢٦٦)' }
  ];

  function renderDua(){
    var d = pickRotating(DUAS, 1)[0];
    if(!d){ els.dua.innerHTML = ''; return; }
    els.dua.innerHTML =
      '<div class="dua-ar" lang="ar" dir="rtl">' + d.ar + '</div>' +
      '<div class="dua-src" lang="ar" dir="rtl">' + d.src + '</div>';
  }

  function isPending(t){ return !!(t.dependency && t.dependency.trim()); }

  /* "Today" / "Tomorrow" / "N days ago" bucket for a given ISO date,
     relative to today — each overdue date gets its own bucket (not one
     lumped "Overdue") so the exact lateness is always visible in the
     header itself. */
  function dayInfo(iso, todayISO){
    var d = new Date(iso + 'T00:00:00');
    var today = new Date(todayISO + 'T00:00:00');
    var diff = Math.round((d - today) / 86400000);
    var dateStr = d.toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'});
    var label;
    if(diff === 0) label = 'Today';
    else if(diff === 1) label = 'Tomorrow';
    else if(diff === -1) label = dateStr + ' · Yesterday';
    else if(diff < -1) label = dateStr + ' · ' + Math.abs(diff) + ' days ago';
    else label = dateStr;
    return {label: label, diff: diff};
  }

  var todoAll = false;
  function render(){
    renderDua();
    renderAssistant();
    renderDashboard();
    renderScout();
    renderTodos();
    renderToday();
    renderLibPicks();
  }

  /* ---- To-dos: only tasks (late, today, the next week), each with a box to tick ---- */
  function todoRow(t, chip, cls){
    return '<div class="todo ' + (cls || '') + '" data-id="' + t.id + '">' +
      '<button type="button" class="todo-check" data-act="done" aria-label="Mark done"></button>' +
      '<a class="todo-text" href="tasks.html#task-' + t.id + '">' + L.escapeHTML(t.description || 'Untitled') + '</a>' +
      '<span class="todo-due">' + L.escapeHTML(chip) + '</span></div>';
  }
  function tickDays(){ try { return JSON.parse(localStorage.getItem('badriyah-ticks') || '[]'); } catch(e){ return []; } }
  function streakCount(){
    var days = tickDays(), set = {}; days.forEach(function(d){ set[d] = true; });
    var d = L.todayISO(), n = 0;
    if(!set[d]) d = addDaysISO(d, -1);              // today doesn't break a streak until it's over
    while(set[d]){ n++; d = addDaysISO(d, -1); }
    return n;
  }
  function recordTick(){
    var T = L.todayISO(), days = tickDays();
    if(days.indexOf(T) === -1){ days.push(T); try { localStorage.setItem('badriyah-ticks', JSON.stringify(days.slice(-60))); } catch(e){} }
  }
  function renderSummary(dueToday, doneToday){
    var el = document.getElementById('todaysum');
    var total = dueToday, left = total - doneToday, pct = total ? doneToday / total : 0, C = 163.4;
    var streak = streakCount();
    var line = !total ? 'Nothing due today. A calm day.' : left === 0 ? 'Clean sheet today. Well done.' : doneToday + ' of ' + total + ' done today. ' + left + ' to go, then you’re free.';
    el.innerHTML = '<div class="ring"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="7"/>' +
      '<circle cx="32" cy="32" r="26" fill="none" stroke="var(--good,#2E7D4F)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '"/></svg>' +
      '<b>' + (total ? doneToday + '/' + total : '✓') + '</b></div>' +
      '<div class="sum-text"><div class="sum-line">' + L.escapeHTML(line) + '</div>' +
      (streak >= 2 ? '<div class="sum-sub">' + streak + '-day streak of ticking things off</div>' : '') + '</div>';
  }
  function renderTodos(){
    var T = L.todayISO(), weekEnd = addDaysISO(T, 7);
    var all = L.state.tasks.filter(function(t){ return !t.archived && (t.description || '').trim() && t.due && !L.hasChildren(t.no); });
    var tasks = all.filter(function(t){ return !t.struck; });
    var byDue = function(a, b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : (a.order || 0) - (b.order || 0); };
    var late = tasks.filter(function(t){ return t.due < T && !isPending(t); }).sort(byDue);
    var todayAll = all.filter(function(t){ return t.due === T; }).sort(function(a, b){ return (a.struck ? 1 : 0) - (b.struck ? 1 : 0) || (a.order || 0) - (b.order || 0); });
    var today = todayAll.filter(function(t){ return !t.struck; });
    var soon = tasks.filter(function(t){ return t.due > T && t.due <= weekEnd; }).sort(byDue);
    var cap = todoAll ? 99 : 6;
    var html = '';
    if(todayAll.length) html += '<div class="todo-group">Today</div>' + todayAll.slice(0, cap + 4).map(function(t){ return todoRow(t, 'Today', t.struck ? 'is-done' : ''); }).join('');
    if(soon.length) html += '<div class="todo-group">Next 7 days</div>' + soon.slice(0, cap).map(function(t){
      var d = diffDays(T, t.due); return todoRow(t, d === 1 ? 'Tomorrow' : prettyDate(t.due).replace(/,.*/, '') + ' ' + new Date(t.due + 'T00:00:00').getDate()); }).join('');
    if(late.length) html += '<details class="todo-late"><summary>' + late.length + ' late, one at a time</summary>' + late.slice(0, todoAll ? 99 : 8).map(function(t){
      var d = diffDays(t.due, T); return todoRow(t, d + 'd late', 'is-late'); }).join('') + '</details>';
    if(!html) html = '<div class="panel-empty">Nothing due. Add something above, or enjoy the quiet.</div>';
    var hidden = Math.max(0, soon.length - cap);
    if(hidden > 0 || todoAll) html += '<button type="button" class="q-more" data-act="todomore">' + (todoAll ? 'Show fewer' : 'Show ' + hidden + ' more') + '</button>';
    document.getElementById('todolist').innerHTML = html;
    var parts = [];
    if(today.length) parts.push(today.length + ' left today');
    if(late.length) parts.push(late.length + ' late');
    document.getElementById('todocount').textContent = parts.join(' · ');
    renderSummary(todayAll.length, todayAll.length - today.length);
  }
  document.getElementById('todolist').addEventListener('click', function(e){
    var more = e.target.closest('button[data-act="todomore"]');
    if(more){ todoAll = !todoAll; renderTodos(); return; }
    var b = e.target.closest('button[data-act="done"]'); if(!b) return;
    var row = b.closest('.todo'), wasDone = row.classList.contains('is-done');
    row.classList.toggle('is-done');
    L.toggleStrike(row.dataset.id);
    if(wasDone){ toast('Back on your list', true); } else { recordTick(); toast('Nicely done', true); }
  });

  /* ---- Coming up: events and call deadlines for the next week, grouped by day (shown under Today) ---- */
  function comingUpHTML(){
    var T = L.todayISO(), from = addDaysISO(T, 1), horizonStr = addDaysISO(T, 7), buckets = {};
    function push(iso, item){
      var info = dayInfo(iso, T);
      if(!buckets[info.label]) buckets[info.label] = {order: iso, items: []};
      buckets[info.label].items.push(item);
    }
    L.Events.state.tasks.filter(function(t){ return !t.archived && !t.struck && t.due && t.due >= from && t.due <= horizonStr; }).forEach(function(t){
      push(t.due, {href: 'events.html#task-' + t.id, text: t.description || 'Untitled', meta: t.details || '', cls: 'is-event'});
    });
    // Every call deadline belongs on the calendar, even one you're planning (it also has its own task in To-dos).
    L.callsState.items.filter(function(c){
      if(c.status === 'watch' || c.mine === 'skip' || c.mine === 'submitted') return false;
      var d = L.daysUntil(c.deadline);
      return d !== null && d >= 1 && d <= 7;
    }).forEach(function(c){
      var d = L.daysUntil(c.deadline);
      push(c.deadline, {href: 'calls.html#call-' + c.id, text: c.name, meta: 'Deadline · ' + d + 'd left', cls: 'is-call'});
    });
    var labels = Object.keys(buckets).sort(function(a, b){ return buckets[a].order < buckets[b].order ? -1 : 1; });
    return '<div class="td-sec">Coming up</div><div class="home-days">' + (labels.length ? labels.map(function(label){
      return '<div class="day-group"><div class="day-group-label"><span class="day-node"></span>' + L.escapeHTML(label) + '</div>' +
        buckets[label].items.map(function(it){
          return '<a class="day-item ' + it.cls + '" href="' + it.href + '"><span class="day-item-dot"></span><span class="day-item-text">' + L.escapeHTML(it.text) +
            (it.meta ? '<span class="day-item-meta">' + L.escapeHTML(it.meta) + '</span>' : '') + '</span></a>';
        }).join('') + '</div>';
    }).join('') : '<div class="panel-empty">Nothing on the calendar this week.</div>') + '</div>' +
      '<a class="td-morelink" href="calendar.html">Calendar</a>';
  }

  /* ---- Library picks sit under the scouts ---- */
  function renderLibPicks(){
    var open = L.readingState.items.filter(function(r){ return r.title && r.status !== 'finished'; });
    var pick = pickRotating(open.filter(function(r){ return r.kind !== 'podcast'; }), 1)[0];
    var listen = pickRotating(open.filter(function(r){ return r.kind === 'podcast'; }), 1)[0];
    var row = function(label, r){ return '<a class="lib-pick" href="reading.html#task-' + r.id + '"><span class="lib-k">' + label + '</span><span class="lib-t">' + L.escapeHTML(r.title) + '</span></a>'; };
    document.getElementById('libpicks').innerHTML = (pick || listen) ?
      '<div class="todo-group">From your library</div>' + (pick ? row('Worth a read', pick) : '') + (listen ? row('Worth a listen', listen) : '') : '';
  }

  // ---- tabs (phone): one section at a time. On wide screens all three show. ----
  var TAB_KEY = 'badriyah-home-tab';
  function setTab(p){
    document.querySelectorAll('#boardtabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.p === p); });
    document.querySelectorAll('.board .panel').forEach(function(sec){ sec.classList.toggle('on', sec.dataset.panel === p); });
    try { localStorage.setItem(TAB_KEY, p); } catch(e){}
  }
  document.getElementById('boardtabs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-p]'); if(b) setTab(b.dataset.p);
  });
  (function(){ var saved = null; try { saved = localStorage.getItem(TAB_KEY); } catch(e){} if(saved === 'cal') saved = 'today'; if(saved) setTab(saved); })();

  // ---------- small helpers ----------
  function addDaysISO(iso, n){
    var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return L.fmtISO(d);
  }
  function diffDays(a, b){ return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
  function prettyDate(iso){
    return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
  }

  var toastTimer = null;
  function toast(msg, undo){
    var el = document.getElementById('toast');
    el.innerHTML = '<span>' + L.escapeHTML(msg) + '</span>' + (undo ? '<button type="button" id="toastundo">Undo</button>' : '');
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 6000);
    if(undo){
      document.getElementById('toastundo').addEventListener('click', function(){
        (typeof undo === 'function' ? undo : L.undo)();
        el.classList.remove('show');
      });
    }
  }

  // ---------- quick add ----------
  var MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  var WEEKDAYS = {sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6};
  var MON_RE = '(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*';

  /* Pulls a due date (and a #category) out of what was typed, so
     "email Laura tomorrow #SAT" becomes the task "email Laura", due
     tomorrow, category SAT. Short weekday names (sat, mon…) only count
     after "by/on/due/before" so a word like "SAT" isn't taken as Saturday. */
  function parseQuick(text){
    var today = L.todayISO(), lead = '(?:\\b(?:by|on|due|before)\\s+)?';
    var date = '', cut = '', rest = text;
    function take(re, fn){
      if(date) return;
      var m = re.exec(rest);
      if(!m) return;
      var d = fn(m);
      if(d){ date = d; cut = m[0]; }
    }
    function monthDay(mon, day){
      var d = parseInt(day, 10);
      if(!(d >= 1 && d <= 31)) return '';
      var now = new Date(today + 'T00:00:00'), y = now.getFullYear();
      var cand = new Date(y, MONTHS[mon.slice(0,3).toLowerCase()], d);
      if(cand.getDate() !== d) return '';
      if(L.fmtISO(cand) < today) cand = new Date(y + 1, MONTHS[mon.slice(0,3).toLowerCase()], d);
      return L.fmtISO(cand);
    }
    function nextWeekday(name){
      var target = WEEKDAYS[name.toLowerCase()];
      var cur = new Date(today + 'T00:00:00').getDay();
      var delta = (target - cur + 7) % 7;
      return addDaysISO(today, delta === 0 ? 7 : delta);
    }
    take(new RegExp(lead + '\\b(\\d{4}-\\d{2}-\\d{2})\\b', 'i'), function(m){ return m[1]; });
    take(new RegExp(lead + '\\b(?:today|tonight)\\b', 'i'), function(){ return today; });
    take(new RegExp(lead + '\\b(?:tomorrow|tmrw)\\b', 'i'), function(){ return addDaysISO(today, 1); });
    take(new RegExp(lead + '\\bnext week\\b', 'i'), function(){ return addDaysISO(today, 7); });
    take(new RegExp(lead + '\\bin (\\d{1,2}) days?\\b', 'i'), function(m){ return addDaysISO(today, parseInt(m[1], 10)); });
    take(new RegExp(lead + '\\b' + MON_RE + '\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b', 'i'), function(m){ return monthDay(m[1], m[2]); });
    take(new RegExp(lead + '\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+' + MON_RE + '\\b', 'i'), function(m){ return monthDay(m[2], m[1]); });
    take(/\b(?:next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i, function(m){ return nextWeekday(m[1]); });
    take(/\b(?:by|on|due|before)\s+(?:next\s+)?(sun|mon|tues?|wed|thur?s?|fri|sat)\b/i, function(m){ return nextWeekday(m[1]); });
    if(cut) rest = rest.replace(cut, ' ');

    var category = '';
    var tag = /(?:^|\s)#([\w-]+)/.exec(rest);
    if(tag){
      var typed = tag[1];
      var known = {};
      L.state.tasks.forEach(function(t){ if(t.category) known[t.category.toLowerCase()] = t.category; });
      category = known[typed.toLowerCase()] || typed;
      rest = rest.replace(tag[0], ' ');
    }
    var desc = rest.replace(/\s+/g, ' ').replace(/^[\s,.\-–—:;]+|[\s,.\-–—:;]+$/g, '');
    return {desc: desc || text.trim(), due: date, category: category};
  }

  var qaForm = document.getElementById('qaform');
  var qaText = document.getElementById('qatext');
  var qaDate = document.getElementById('qadate');
  var qaBtn = document.getElementById('qabtn');
  var qaHint = document.getElementById('qahint');
  var DEFAULT_HINT = qaHint.textContent;
  var manualDate = false;

  function updateQuickHint(){
    var raw = qaText.value;
    if(!raw.trim()){ qaHint.textContent = DEFAULT_HINT; if(!manualDate) qaDate.value = ''; return; }
    var p = parseQuick(raw);
    if(!manualDate) qaDate.value = p.due;
    var due = qaDate.value;
    var bits = [];
    if(due) bits.push('Due ' + prettyDate(due));
    if(p.category) bits.push('Category ' + p.category);
    qaHint.textContent = bits.length ? bits.join(' · ') : 'No due date. That\'s fine, you can add one later.';
  }
  qaText.addEventListener('input', updateQuickHint);
  qaDate.addEventListener('change', function(){
    manualDate = !!qaDate.value;
    updateQuickHint();
  });
  qaForm.querySelector('.qa-chips').addEventListener('click', function(e){
    var b = e.target.closest('button[data-d]');
    if(!b) return;
    qaDate.value = addDaysISO(L.todayISO(), parseInt(b.dataset.d, 10));
    manualDate = true;
    updateQuickHint();
    qaText.focus();
  });
  qaForm.addEventListener('submit', function(e){
    e.preventDefault();
    var raw = qaText.value.trim();
    if(!raw) return;
    var p = parseQuick(raw), due = qaDate.value;
    qaBtn.disabled = true;
    L.addTask({description: p.desc, due: due, category: p.category}).then(function(r){
      qaText.value = ''; qaDate.value = ''; manualDate = false;
      updateQuickHint();
      toast('Added ' + r.no + ' · ' + p.desc + (due ? ' · due ' + prettyDate(due) : ''), true);
    }).catch(function(err){
      console.error(err);
      toast('Could not add that. Check your connection and try again.', false);
    }).then(function(){ qaBtn.disabled = false; qaText.focus(); });
  });

  // ---------- quick questions (the little assistant) ----------
  /* Looks through the live task list for things that are stuck and asks
     one plain question about each, with buttons that make the change
     right here. Nothing is guessed: every change comes from a button
     press, and "Not now" hides a question until tomorrow. */
  var DISMISS_KEY = 'badriyah-assistant-dismissed-v1';
  var openMode = null; // {qid, mode}
  var showAll = false;

  function loadDismissed(){
    var today = L.todayISO();
    try {
      var o = JSON.parse(localStorage.getItem(DISMISS_KEY) || 'null');
      if(o && o.day === today) return o;
    } catch(e){}
    return {day: today, keys: [], someday: (function(){ try { return (JSON.parse(localStorage.getItem(DISMISS_KEY) || 'null') || {}).someday || []; } catch(e){ return []; } })()};
  }
  function saveDismissed(o){ try { localStorage.setItem(DISMISS_KEY, JSON.stringify(o)); } catch(e){} }
  function dismissQuestion(qid, forever){
    var o = loadDismissed();
    (forever ? o.someday : o.keys).push(qid);
    saveDismissed(o);
  }

  function buildQuestions(){
    var T = L.todayISO();
    var tasks = L.state.tasks.filter(function(t){ return !t.archived && !t.struck; });
    function leaf(t){ return !L.hasChildren(t.no); }
    var by = {today: [], overdue: [], waiting: [], callsub: [], call: [], event: [], step: [], nodue: [], nodep: [], parentdone: [], reading: [], prompt: []};

    tasks.filter(function(t){ return t.due && t.due < T && leaf(t) && !isPending(t); })
      .sort(function(a, b){ return a.due < b.due ? -1 : 1; })
      .forEach(function(t){ by.overdue.push({qid: 'ovr:' + t.id, type: 'overdue', t: t}); });

    tasks.filter(function(t){ return t.due && t.due < T && leaf(t) && isPending(t) && diffDays(t.due, T) >= 4; })
      .sort(function(a, b){ return a.due < b.due ? -1 : 1; })
      .forEach(function(t){ by.waiting.push({qid: 'wait:' + t.id, type: 'waiting', t: t}); });

    L.callsState.items.filter(function(c){
      var d = L.daysUntil(c.deadline);
      return !c.mine && c.status !== 'watch' && d !== null && d >= 0 && d <= 7;
    }).sort(function(a, b){ return L.daysUntil(a.deadline) - L.daysUntil(b.deadline); })
      .forEach(function(c){ by.call.push({qid: 'call:' + c.id, type: 'call', c: c}); });

    tasks.filter(function(t){
      var d = t.due ? diffDays(T, t.due) : -1;
      return d >= 1 && d <= 5 && leaf(t) && !isPending(t) && !(t.details || '').trim();
    }).sort(function(a, b){ return a.due < b.due ? -1 : 1; })
      .forEach(function(t){ by.step.push({qid: 'step:' + t.id, type: 'step', t: t}); });

    var undated = tasks.filter(function(t){ return !t.due && leaf(t) && !isPending(t) && (t.description || '').trim(); });
    if(undated.length){
      var t0 = undated[Math.floor(new Date().getTime() / 86400000) % undated.length];
      by.nodue.push({qid: 'nodue:' + t0.id, type: 'nodue', t: t0});
    }


    tasks.filter(function(t){ return t.due === T && leaf(t); })
      .forEach(function(t){ by.today.push({qid: 'today:' + t.id, type: 'today', t: t}); });

    tasks.filter(function(t){ return !t.due && leaf(t) && isPending(t); })
      .forEach(function(t){ by.nodep.push({qid: 'nodep:' + t.id, type: 'nodep', t: t}); });

    L.state.tasks.filter(function(t){ return !t.archived && !t.struck && t.no && L.hasChildren(t.no); }).forEach(function(t){
      var kids = L.state.tasks.filter(function(x){ return x.no && x.no.indexOf(t.no + '.') === 0; });
      if(kids.length && kids.every(function(x){ return x.struck || x.archived; })){
        by.parentdone.push({qid: 'pdone:' + t.id, type: 'parentdone', t: t});
      }
    });

    L.callsState.items.filter(function(c){
      var d = L.daysUntil(c.deadline);
      return c.mine === 'planning' && d !== null && d >= 0 && d <= 14;
    }).sort(function(a, b){ return L.daysUntil(a.deadline) - L.daysUntil(b.deadline); })
      .forEach(function(c){ by.callsub.push({qid: 'callsub:' + c.id, type: 'callsub', c: c}); });

    L.Events.state.tasks.filter(function(e){
      var d = e.due ? diffDays(T, e.due) : -1;
      return !e.archived && !e.struck && d >= 0 && d <= 3;
    }).sort(function(a, b){ return a.due < b.due ? -1 : 1; })
      .forEach(function(e){ by.event.push({qid: 'event:' + e.id, type: 'event', o: e}); });

    L.readingState.items.filter(function(r){ return r.status === 'reading' && r.title; })
      .forEach(function(r){ by.reading.push({qid: 'read:' + r.id, type: 'reading', o: r}); });

    // One reflective prompt a day, so there is always a way to get something out of your head.
    var PROMPTS = [
      {text: 'What’s one thing you’ve been putting off?', ph: 'e.g. call the ministry about the license', due: 1},
      {text: 'Anything on your mind that isn’t written down yet?', ph: 'Type it here and it becomes a task', due: 0},
      {text: 'What would make tomorrow easier if you did it tonight?', ph: 'e.g. lay out the files for the Sharjah submission', due: 1}
    ];
    var pi = Math.floor(new Date().getTime() / 86400000) % PROMPTS.length;
    by.prompt.push({qid: 'prompt:' + T, type: 'prompt', p: PROMPTS[pi]});

    // Keep the chatty types short so the list stays a few quick decisions, not a chore.
    ['today', 'callsub', 'event', 'reading'].forEach(function(k){ by[k] = by[k].slice(0, 2); });

    // Round-robin across types so one kind of question doesn't crowd out the rest.
    var order = ['today', 'overdue', 'waiting', 'callsub', 'call', 'event', 'step', 'nodep', 'parentdone', 'nodue', 'reading', 'prompt'], out = [], i = 0, more = true;
    while(more){
      more = false;
      order.forEach(function(k){ if(by[k][i]){ out.push(by[k][i]); more = true; } });
      i++;
    }
    var dis = loadDismissed();
    return out.filter(function(q){ return dis.keys.indexOf(q.qid) === -1 && dis.someday.indexOf(q.qid) === -1; });
  }

  function chipsHTML(extraAttr){
    return '<span class="q-chips">' +
      '<button type="button" data-a="moveto" data-days="1"' + extraAttr + '>Tomorrow</button>' +
      '<button type="button" data-a="moveto" data-days="3"' + extraAttr + '>In 3 days</button>' +
      '<button type="button" data-a="moveto" data-days="7"' + extraAttr + '>Next week</button>' +
      '<input type="date" data-a="movedate" aria-label="Pick a date">' +
      '</span>';
  }
  /* Conferences and calls are hard to judge from a name alone, so a call question carries the
     facts plus a plain read of how much it would help: peer review and a close fit count for
     more, venues that accept almost everyone count for less. The reasons are always shown. */
  function callRead(c){
    var tags = (c.tags || []).map(function(t){ return String(t).toLowerCase(); });
    var fit = String(c.fit || ''), fmt = String(c.format || '');
    var peer = tags.indexOf('peer-reviewed') !== -1 || /peer|double-blind|proceedings/i.test(fit + ' ' + fmt);
    var wide = tags.indexOf('quantity') !== -1 || /accepts widely|accept widely|quantity/i.test(fit);
    var online = c.online === true || tags.indexOf('online') !== -1;
    var close = /strong fit|close fit|fits well|natural fit|good fit|fits the|fits both/i.test(fit);
    var chips = [];
    if(peer) chips.push('Peer-reviewed');
    if(close) chips.push('Close fit');
    if(online) chips.push('Online ok');
    if(wide) chips.push('Accepts widely');
    var label = '';
    if(c.kind !== 'award'){
      var score = (peer ? 2 : 0) + (close ? 1 : 0) - (wide ? 1 : 0);
      label = score >= 2 ? 'Strong for your CV' : score === 1 ? 'Solid for your CV' : 'Lighter weight for a CV';
    }
    return {label: label, chips: chips, fit: fit};
  }
  function callFactsHTML(c){
    var r = callRead(c), L2 = L.escapeHTML;
    var facts = [c.location, c.eventDates, c.format].filter(Boolean).map(L2).join(' · ');
    return '<span class="q-facts">' +
      (r.label ? '<span class="q-read">' + L2(r.label) + '</span>' : '') +
      (facts ? '<span class="q-fact-line">' + facts + '</span>' : '') +
      (r.chips.length ? '<span class="q-chips2">' + r.chips.map(function(x){ return '<span>' + L2(x) + '</span>'; }).join('') + '</span>' : '') +
      (r.fit ? '<span class="q-fit">' + L2(r.fit) + '</span>' : '') +
      '</span>';
  }
  function questionHTML(q){
    /* Each name links straight to that item on its own page (same jump-and-highlight
       as the timeline below), so a question can be checked against the real row. */
    var ql = function(href, title){ return '<a class="q-link" href="' + href + '"><b>\u201C' + L.escapeHTML(title) + '\u201D</b></a>'; };
    var name = function(t){ return ql('tasks.html#task-' + t.id, t.description || 'Untitled'); };
    var open = openMode && openMode.qid === q.qid ? openMode.mode : null;
    var text = '', actions = '', extra = '';
    var skip = '<button type="button" class="q-skip" data-a="skip">Not now</button>';
    if(q.type === 'overdue'){
      var n = diffDays(q.t.due, L.todayISO());
      text = 'Is ' + name(q.t) + ' done, waiting on someone, or still yours? <span class="q-meta">' + n + (n === 1 ? ' day' : ' days') + ' overdue</span>';
      actions = '<button type="button" data-a="done">Done</button><button type="button" data-a="wait">Waiting on someone</button>' +
        '<button type="button" data-a="move">Move the date</button><button type="button" data-a="step">First step</button>' +
        '<button type="button" data-a="drop">Drop it</button>' + skip;
    } else if(q.type === 'waiting'){
      var w = diffDays(q.t.due, L.todayISO());
      text = 'You’re waiting on <b>' + L.escapeHTML(q.t.dependency) + '</b> for ' + name(q.t) + '. Have you followed up? <span class="q-meta">' + w + ' days past its date</span>';
      actions = '<button type="button" data-a="done">It’s sorted</button><button type="button" data-a="followed">I followed up</button>' +
        '<button type="button" data-a="nudge">Nudge me tomorrow</button>' + skip;
    } else if(q.type === 'step'){
      var dd = diffDays(L.todayISO(), q.t.due);
      text = name(q.t) + ' is due ' + (dd === 1 ? 'tomorrow' : 'in ' + dd + ' days') + ' and has no notes yet. What’s the very first step?';
      actions = '<button type="button" data-a="step">Add the first step</button><button type="button" data-a="move">Move the date</button>' + skip;
    } else if(q.type === 'call'){
      var cd = L.daysUntil(q.c.deadline);
      text = 'Are you applying to ' + ql('calls.html#call-' + q.c.id, q.c.name) + '? <span class="q-meta">Closes ' + (cd === 0 ? 'today' : 'in ' + cd + (cd === 1 ? ' day' : ' days')) + '</span>';
      actions = '<button type="button" data-a="callyes">Yes, plan it</button><button type="button" data-a="callno">No, skip it</button>' + skip;
      text += callFactsHTML(q.c);
    } else if(q.type === 'nodue'){
      text = 'When should ' + name(q.t) + ' happen? <span class="q-meta">No date yet</span>';
      actions = chipsHTML('') + '<button type="button" class="q-skip" data-a="someday">Someday</button>' + skip;
    } else if(q.type === 'today'){
      text = 'Will you finish ' + name(q.t) + ' today? <span class="q-meta" style="color:var(--muted)">Due today</span>';
      actions = '<button type="button" data-a="done">Already done</button><button type="button" data-a="skip">Yes, on it</button>' +
        '<button type="button" data-a="move">Move the date</button><button type="button" data-a="wait">Blocked by someone</button>' + skip;
    } else if(q.type === 'nodep'){
      text = 'You’re waiting on <b>' + L.escapeHTML(q.t.dependency) + '</b> for ' + name(q.t) + '. When will you check in? <span class="q-meta" style="color:var(--muted)">No date yet</span>';
      actions = chipsHTML('') + skip;
    } else if(q.type === 'parentdone'){
      text = 'Everything under ' + name(q.t) + ' is done. Mark the whole thing done?';
      actions = '<button type="button" data-a="done">Yes, mark it done</button>' + skip;
    } else if(q.type === 'callsub'){
      var sd = L.daysUntil(q.c.deadline);
      text = 'Have you submitted ' + ql('calls.html#call-' + q.c.id, q.c.name) + '? <span class="q-meta">Closes ' + (sd === 0 ? 'today' : 'in ' + sd + (sd === 1 ? ' day' : ' days')) + '</span>';
      actions = '<button type="button" data-a="callsubmitted">Yes, submitted</button><button type="button" data-a="skip">Still working on it</button>' +
        '<button type="button" data-a="callno">Drop it</button>' + skip;
      text += callFactsHTML(q.c);
    } else if(q.type === 'event'){
      var ed = diffDays(L.todayISO(), q.o.due);
      text = 'Are you going to ' + ql('events.html#task-' + q.o.id, q.o.description || 'Untitled') + '? <span class="q-meta" style="color:var(--muted)">' + (ed === 0 ? 'Today' : ed === 1 ? 'Tomorrow' : prettyDate(q.o.due)) + '</span>';
      actions = '<button type="button" data-a="eventyes">Yes</button><button type="button" data-a="eventno">No, clear it</button>' + skip;
    } else if(q.type === 'reading'){
      var pod = q.o.kind === 'podcast';
      text = (pod ? 'Still listening to ' : 'Still reading ') + ql('reading.html#task-' + q.o.id, q.o.title) + '?' + (q.o.author ? ' <span class="q-meta" style="color:var(--muted)">' + L.escapeHTML(q.o.author) + '</span>' : '');
      actions = '<button type="button" data-a="readfinished">Finished it</button><button type="button" data-a="skip">' + (pod ? 'Still listening' : 'Still reading') + '</button>' +
        '<button type="button" data-a="readback">Put it back</button>' + skip;
    } else if(q.type === 'prompt'){
      text = q.p.text;
      extra = '<form class="q-form" data-a="saveprompt"><input type="text" placeholder="' + L.escapeHTML(q.p.ph) + '" aria-label="Your answer"><button type="submit">Add as task</button></form>';
      actions = skip;
    }
    if(open === 'wait'){
      extra = '<form class="q-form" data-a="savewait"><input type="text" placeholder="Who or what are you waiting on?" aria-label="Waiting on"><button type="submit">Save</button></form>';
    } else if(open === 'move'){
      extra = chipsHTML('');
    } else if(open === 'step'){
      extra = '<form class="q-form" data-a="savestep"><input type="text" placeholder="e.g. open the form and read the requirements" aria-label="First step"><button type="submit">Add as sub-task</button></form>';
    }
    return '<div class="q" data-qid="' + q.qid + '" data-id="' + ((q.t || q.c || q.o || {}).id || '') + '" data-type="' + q.type + '" data-due="' + (q.p ? q.p.due : '') + '">' +
      '<div class="q-text">' + text + '</div>' +
      '<div class="q-actions">' + actions + '</div>' +
      (extra ? '<div class="q-extra">' + extra + '</div>' : '') +
      '</div>';
  }

  var assistBody = document.getElementById('assistbody');
  var assistCount = document.getElementById('assistcount');
  var assistEl = document.getElementById('assist');
  function renderAssistant(){
    var ae = document.activeElement;
    if(ae && assistBody.contains(ae) && ae.tagName === 'INPUT') return; // don't wipe what she's typing
    if(!L.state.tasks.length){ assistEl.style.display = 'none'; return; }
    assistEl.style.display = '';
    var qs = buildQuestions();
    assistCount.textContent = qs.length ? String(qs.length) : '';
    if(!qs.length){
      assistBody.innerHTML = '<div class="q-none">Nothing needs a decision right now.</div>';
      return;
    }
    var shown = showAll ? qs : qs.slice(0, 3);
    assistBody.innerHTML = shown.map(questionHTML).join('') +

  // ---------- Today: a plan for the rest of the day ----------

  var healthPlan = {}, planReady = false;     // planReady: the real plan has arrived from the server, so it is safe to edit

  var WIND_DOWN = 21 * 60;

  function setTitle(){ document.title = timer && !timer.over ? mmss(Math.max(0, Math.ceil((timer.end - Date.now()) / 1000))) + ' · ' + baseTitle : baseTitle; }

  }

  }

      } else localStorage.removeItem(TIMER_KEY);

  function dayKey(){ var d = new Date(); if(d.getHours() < 5) d.setDate(d.getDate() - 1); return L.fmtISO(d); }

  function timeText(txt){

  function buildPlan(budget){

    var tasks = L.state.tasks.filter(function(t){ return !t.archived && !t.struck && (t.description || '').trim() && !L.hasChildren(t.no) && !isPending(t); });

    });
    L.callsState.items.filter(function(c){ return c.status !== 'watch' && c.mine !== 'skip' && c.mine !== 'submitted' && L.daysUntil(c.deadline) === 0 && !st.skip['call:' + c.id]; }).forEach(function(c){
      also.push('<a class="td-pill dl" href="calls.html#call-' + c.id + '">' + L.escapeHTML(clip(c.name, 40)) + '<small>closes today</small></a>');
    });
    if(also.length) more += '<div class="td-sec">Also today</div><div class="td-also">' + also.join('') + '</div>';

    // calls closing within five days (always visible: they're the ones that slip), then other things due in three days (under More)
    var inPlan = {}; P.plan.concat(P.later, P.skipped).forEach(function(x){ inPlan[x.key] = 1; }); Object.keys(nxtIds).forEach(function(k){ inPlan[k] = 1; });
    var closingTaskIds = {};
    var callsSoon = L.callsState.items.filter(function(cl){
      var dd = L.daysUntil(cl.deadline);
      return cl.status !== 'watch' && cl.mine !== 'skip' && cl.mine !== 'submitted' && dd !== null && dd >= 0 && dd <= 5 && !inPlan['call:' + cl.id];
    }).sort(function(a, b){ return a.deadline < b.deadline ? -1 : 1; }).slice(0, 3);
    L.callsState.items.forEach(function(cl){ if(cl.linkedTaskId) closingTaskIds[cl.linkedTaskId] = 1; });
    if(callsSoon.length) h += '<div class="td-sec">Closing soon</div>' + callsSoon.map(function(cl){
      var dd = L.daysUntil(cl.deadline);
      return '<a class="td-row" href="calls.html#call-' + cl.id + '">' + L.escapeHTML(clip(cl.name, 80)) + '<small>' + closesWord(cl) + ' ' + (dd === 0 ? 'today' : dd === 1 ? 'tomorrow' : prettyDate(cl.deadline)) + '</small></a>';
    }).join('');
    var soon = L.state.tasks.filter(function(t){
      return !t.archived && !t.struck && (t.description || '').trim() && !L.hasChildren(t.no) && !isPending(t) && t.due && t.due > T && t.due <= addDaysISO(T, 3) && !inPlan['task:' + t.id] && !closingTaskIds[t.id];
    }).sort(function(a, b){ return a.due < b.due ? -1 : 1; }).slice(0, 3);
    if(soon.length) more += '<div class="td-sec">Soon</div>' + soon.map(function(t){
      var dd = diffDays(T, t.due);
      return '<a class="td-row" href="tasks.html#task-' + t.id + '">' + L.escapeHTML(clip(t.description, 80)) + '<small>' + (dd === 1 ? 'tomorrow' : prettyDate(t.due)) + '</small></a>';
    }).join('');
    if(tail.length) more += '<p class="td-later">' + tail.join('<br>') + '</p>';
    if(!weekOnTop) more += weekAheadHTML(false);
    more += comingUpHTML();
    h += '<details class="td-fold" data-d="more"><summary>More</summary>' + more + '</details>';
    el.innerHTML = h;
    el.querySelectorAll('details[data-d]').forEach(function(dt){ if(Object.prototype.hasOwnProperty.call(openState, dt.dataset.d)) dt.open = !!openState[dt.dataset.d]; });
    if(focusRef){   // keep keyboard focus where it was after a redraw
      var again = [].slice.call(el.querySelectorAll('[data-act="' + focusRef.act + '"]')).filter(function(x){
        return (x.dataset.key || '') === focusRef.key && (x.dataset.i || '') === focusRef.i && (x.dataset.wd || '') === focusRef.wd && (x.dataset.slot || '') === focusRef.slot; })[0];
      if(!again && /^(fstart|tstop|tstart)$/.test(focusRef.act)) again = el.querySelector(focusRef.card ? '.td-focus [data-act="tstop"], .td-focus [data-act="fstart"]' : '.td-act [data-act="tstop"], .td-act [data-act="tstart"]') || el.querySelector('.td-focus [data-act="tstop"], .td-focus [data-act="fstart"]');
      if(again) try { again.focus({preventScroll: true}); } catch(e){}
    }
  }
  document.getElementById('todaybody').addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    var act = b.dataset.act, st = prepState();
    if(act === 'step'){
      var k = b.dataset.key + '|' + b.dataset.i;
      if(st.done[k]) delete st.done[k]; else { st.done[k] = L.todayISO(); if(timer && timer.key === k){ savePrep(st); stopTimer(true); return; } }
      savePrep(st); renderToday();
    } else if(act === 'skip'){
      st.skip[b.dataset.key] = 1; if(timer && timer.key.indexOf(b.dataset.key + '|') === 0){ savePrep(st); stopTimer(true); } savePrep(st); toast('Okay, skipped for ' + skipWord(false)); renderToday();
    } else if(act === 'unskip'){
      delete st.skip[b.dataset.key]; savePrep(st); renderToday();
    } else if(act === 'tstart'){
      startTimer(b.dataset.key, +b.dataset.min || 10);
    } else if(act === 'fstart'){
      startTimer('focus', 25);
    } else if(act === 'tstop'){
      stopTimer(false);
    } else if(act === 'taskdone'){
      L.toggleStrike(b.dataset.id); recordTick(); toast('Nicely done', true);
    } else if(act === 'callsubmit'){
      var cid = b.dataset.id, call = L.callsState.items.filter(function(x){ return x.id === cid; })[0];
      L.setCallMine(cid, 'submitted');
      if(call && call.linkedTaskId){ var lt = L.state.tasks.filter(function(x){ return x.id === call.linkedTaskId; })[0]; if(lt && !lt.struck) L.toggleStrike(lt.id); }
      recordTick(); toast('Submitted. Well done.');
    } else if(act === 'pil'){
      setPilates(+b.dataset.wd, b.dataset.slot);
    } else if(act === 'weekno'){
      try { localStorage.setItem('badriyah-week-dismiss', L.todayISO()); } catch(e){}
      var wkEl = document.querySelector('.td-week'); if(wkEl) wkEl.open = false;
      toast('Okay, no planning this week. The week view stays near the bottom if you change your mind.'); renderToday();
      var hd = document.querySelector('.p-today .panel-head h2'); if(hd){ hd.setAttribute('tabindex', '-1'); try { hd.focus({preventScroll: true}); } catch(e){} }
    } else if(act === 'copy'){
      var itKey = b.dataset.key, id = itKey.replace(/^task:/, ''), kit = prep.tasks && prep.tasks[id], l = kit && kit.lists && kit.lists[+b.dataset.li];
      if(!l) return;
      var text = l.title + '\n' + l.items.map(function(x, n){ return (n + 1) + '. ' + x; }).join('\n');
      var ok = function(){ toast('Copied'); };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, function(){ toast('Couldn’t copy. Select the text instead.'); }); }
      else toast('Couldn’t copy. Select the text instead.');
    }
  });
  setInterval(function(){
    if(timer && !timer.over){
      var secs = Math.ceil((timer.end - Date.now()) / 1000);
      if(secs <= 0){
        var doneT = timer, doneMins = timer.mins;
        timer.over = true; saveTimer(); setTitle();
        if(claimLog(doneT)) logFocus(doneMins, L.fmtISO(new Date(doneT.start))); else renderToday();
        toast('That’s ' + doneMins + (doneMins === 1 ? ' minute' : ' minutes') + ', logged. A short break could be nice, or keep going, whatever suits.');
        return;
      }
      document.querySelectorAll('.td-timer').forEach(function(t){ t.textContent = mmss(secs); });
      document.querySelectorAll('.td-arc').forEach(function(arc){ arc.setAttribute('stroke-dashoffset', (RING_C * (1 - secs / (timer.mins * 60))).toFixed(1)); });
      setTitle();
    }
  }, 1000);
  setInterval(function(){
    var body = document.getElementById('todaybody'), a = document.activeElement;
    var keep = body && a && body.contains(a) && a !== body && !(a.dataset && a.dataset.act);   // buttons are restored after a redraw; other focus (a link, the summary) is left alone
    if((!timer || timer.over) && !keep) renderToday();
  }, 60000);

  // ---------- scout: daily art and architecture finds from the Gulf ----------
  /* A scheduled task files a few verified finds a day into the "scout" collection.
     Text comes from the web, so it is always escaped and links must be http(s). */
  var SCOUT_DISMISS = 'badriyah-scout-dismissed-v1';
  var scout = {ok: false, items: []};
  var scoutAll = false;
  var SCOUT_TYPES = {opening: 'Opening', call: 'Call', news: 'News', job: 'Job'};
  var SCOUT_TAGS = ['From the Gulf', 'Today’s scout report', 'Worth a look', 'Scouted for you'];
  try {
    firebase.firestore().collection('scout').onSnapshot(function(snap){
      scout.items = snap.docs.map(function(d){ return Object.assign({id: d.id}, d.data()); });
      scout.ok = true; renderScout();
    }, function(){ scout.ok = false; renderScout(); });
  } catch(e){}
  function scoutDismissed(){ try { return JSON.parse(localStorage.getItem(SCOUT_DISMISS) || '[]'); } catch(e){ return []; } }
  function renderScout(){
    var box = document.getElementById('scout'), body = document.getElementById('scoutbody');
    var T = L.todayISO(), hidden = scoutDismissed();
    var items = scout.items.filter(function(i){
      return i.title && /^https?:\/\//i.test(i.link || '') && (!i.expires || i.expires >= T) && hidden.indexOf(i.id) === -1;
    }).sort(function(a, b){ return (b.order || 0) - (a.order || 0); });
    document.getElementById('scoutlabel').textContent = SCOUT_TAGS[dayOfYear() % SCOUT_TAGS.length];
    if(!scout.ok || !items.length){
      document.getElementById('scoutcount').textContent = '';
      body.innerHTML = '<div class="panel-empty">' + (scout.ok ? 'Nothing new from the scout right now.' : 'The scout hasn\u2019t checked in yet.') + '</div>';
      return;
    }
    var fresh = items.filter(function(i){ return i.found === T; }).length;
    document.getElementById('scoutcount').textContent = fresh ? fresh + ' new today' : items.length + (items.length === 1 ? ' find' : ' finds');
    var shown = scoutAll ? items : items.slice(0, 3);
    var added = scoutAdded();
    body.innerHTML = shown.map(function(i){
      var meta = [i.country, i.dateLabel, i.source].filter(Boolean).map(L.escapeHTML).join(' · ');
      return '<div class="scout-item" data-id="' + L.escapeHTML(i.id) + '">' +
        '<span class="scout-type t-' + L.escapeHTML(i.type || 'news') + '">' + L.escapeHTML(SCOUT_TYPES[i.type] || 'News') + (i.found === T ? ' · new' : '') + '</span>' +
        '<a class="scout-title" href="' + L.escapeHTML(i.link) + '" target="_blank" rel="noopener noreferrer">' + L.escapeHTML(i.title) + ' ↗</a>' +
        (i.blurb ? '<span class="scout-blurb">' + L.escapeHTML(i.blurb) + '</span>' : '') +
        '<span class="scout-meta">' + meta + '</span>' +
        '<span class="scout-actions">' + scoutActionsHTML(i, added[i.id]) +
        '<button type="button" class="scout-x" data-a="hide">Not for me</button></span>' +
        '</div>';
    }).join('') + (items.length > 3 ? '<button type="button" class="q-more" data-a="more">' + (scoutAll ? 'Show fewer' : 'Show ' + (items.length - 3) + ' more') + '</button>' : '');
  }

  /* One tap puts a find where it belongs: openings on the calendar (the Events tab, which the
     Calendar page shows), calls as a task due the day before the deadline, jobs as a row in the
     Jobs sheet, news in the Library. A Google Calendar link is there too for the phone's own calendar. */
  var SCOUT_ADDED = 'badriyah-scout-added-v1';
  var SCOUT_DONE = {cal: 'On your calendar', task: 'Added as a task', jobs: 'Added to Jobs', lib: 'Saved to Library'};
  var SCOUT_DONE_HREF = {cal: 'calendar.html', task: 'tasks.html', jobs: 'jobs.html', lib: 'reading.html'};
  function scoutAdded(){ try { return JSON.parse(localStorage.getItem(SCOUT_ADDED) || '{}'); } catch(e){ return {}; } }
  function markScoutAdded(id, kind){ var a = scoutAdded(); a[id] = kind; try { localStorage.setItem(SCOUT_ADDED, JSON.stringify(a)); } catch(e){} }
  function gcalURL(i){
    var d = String(i.dateISO || '').replace(/-/g, ''); if(d.length !== 8) return '';
    var nextDay = L.fmtISO(new Date(new Date(i.dateISO + 'T00:00:00').getTime() + 86400000)).replace(/-/g, '');
    var text = (i.type === 'call' ? 'Deadline: ' : '') + i.title;
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(text) +
      '&dates=' + d + '/' + nextDay + '&details=' + encodeURIComponent((i.blurb ? i.blurb + '\n\n' : '') + i.link) +
      (i.country ? '&location=' + encodeURIComponent(i.country) : '');
  }
  function scoutActionsHTML(i, done){
    if(done) return '<a class="scout-done" href="' + SCOUT_DONE_HREF[done] + '">' + SCOUT_DONE[done] + ' ✓</a>';
    var g = gcalURL(i), gl = g ? '<a class="scout-gcal" href="' + L.escapeHTML(g) + '" target="_blank" rel="noopener noreferrer">Google Calendar ↗</a>' : '';
    if(i.type === 'opening' && i.dateISO) return '<button type="button" class="scout-add" data-a="cal">Add to calendar</button>' + gl;
    if(i.type === 'call') return '<button type="button" class="scout-add" data-a="task">Add as task</button>' + gl;
    if(i.type === 'job') return '<button type="button" class="scout-add" data-a="jobs">Add to Jobs</button>';
    return '<button type="button" class="scout-add" data-a="lib">Save to Library</button>';
  }
  function dayBefore(iso){ return L.fmtISO(new Date(new Date(iso + 'T00:00:00').getTime() - 86400000)); }
  function addScoutItem(item, kind){
    var det = [item.blurb, [item.country, item.source].filter(Boolean).join(' · ')].filter(Boolean).join(' — ');
    var fs = firebase.firestore();
    if(kind === 'cal'){
      return L.Events.addTaskWith({description: item.title, details: det, due: item.dateISO, category: 'Scout', link: item.link})
        .then(function(){ toast('On your calendar: ' + prettyDate(item.dateISO), function(){ L.Events.undo(); }); });
    }
    if(kind === 'task'){
      var due = item.dateISO ? dayBefore(item.dateISO) : '';
      return L.addTask({description: item.title, details: det + (item.dateLabel ? ' (' + item.dateLabel + ')' : ''), due: due, category: 'Calls', link: item.link})
        .then(function(){ toast('Added as a task' + (due ? ', due ' + prettyDate(due) + ' (a day before the deadline)' : ''), true); });
    }
    if(kind === 'jobs'){
      var m = /^(.*?):\s+(.+)$/.exec(item.title);
      return fs.collection('jobs').get().then(function(snap){
        var max = 0; snap.docs.forEach(function(d){ max = Math.max(max, d.data().order || 0); });
        return fs.collection('jobs').add({name: m ? m[1] : item.title, role: m ? m[2] : '', stage: 'idea', cvDone: false, portfolioDone: false, applyVia: item.link, notes: 'Found by the scout', order: max + 10});
      }).then(function(){ toast('Added to your Jobs sheet', false); });
    }
    return fs.collection('reading').get().then(function(snap){
      var max = 0, ref = 0; snap.docs.forEach(function(d){ var v = d.data(); max = Math.max(max, v.order || 0); ref = Math.max(ref, parseInt(v.ref, 10) || 0); });
      return fs.collection('reading').add({ref: String(ref + 1), category: 'Gulf', title: item.title, author: item.source || '', year: '', pages: '', priority: '', status: 'not-started', link: item.link, note: item.blurb || '', kind: 'read', order: max + 10});
    }).then(function(){ toast('Saved to your Library', false); });
  }
  document.getElementById('scoutbody').addEventListener('click', function(e){
    var b = e.target.closest('button[data-a]'); if(!b) return;
    if(b.dataset.a === 'more'){ scoutAll = !scoutAll; renderScout(); return; }
    var id = b.closest('.scout-item').dataset.id;
    if(b.dataset.a === 'cal' || b.dataset.a === 'task' || b.dataset.a === 'jobs' || b.dataset.a === 'lib'){
      var item = scout.items.filter(function(x){ return x.id === id; })[0];
      if(!item) return;
      b.disabled = true;
      addScoutItem(item, b.dataset.a).then(function(){ markScoutAdded(id, b.dataset.a); renderScout(); })
        .catch(function(err){ console.error(err); b.disabled = false; toast('Could not add that. Try again.', false); });
      return;
    }
    var list = scoutDismissed();
    list.push(id);
    try { localStorage.setItem(SCOUT_DISMISS, JSON.stringify(list.slice(-300))); } catch(err){}
    renderScout();
  });

  L.onChange(render);
  L.Events.onChange(render);
  L.onCallsChange(render);
  L.onReadingChange(render);
})();
</script>
<script>(function(){var a=document.querySelector('.tab.active');if(a&&a.parentNode){a.parentNode.scrollLeft=Math.max(0,a.offsetLeft-16);}})();</script>
</body>
