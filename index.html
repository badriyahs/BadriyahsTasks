<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script>
(function(){
  "use strict";
  var L = window.Ledger;

  var els = {
    date: document.getElementById('digestdate'),
    syncdot: document.getElementById('syncdot'),
    syncstate: document.getElementById('syncstate'),
    dua: document.getElementById('duabox'),
    days: document.getElementById('homedays')
  };

  els.date.textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});

  L.onStatus(function(kind, text){
    els.syncdot.classList.remove('off','err');
    if(kind !== 'ok') els.syncdot.classList.add(kind);
    els.syncstate.textContent = text;
  });

  function dayOfYear(){
    var now = new Date();
    var start = new Date(now.getFullYear(), 0, 0);
    return Math.floor((now - start) / 86400000);
  }
  function pickRotating(list, n){
    if(!list.length) return [];
    var start = dayOfYear() % list.length;
    var out = [];
    for(var i=0; i<Math.min(n, list.length); i++){ out.push(list[(start+i) % list.length]); }
    return out;
  }

  /* A short set of du'as (with hadith citations) from "أدعية النبي صلى الله
     عليه وسلم", compiled by Sheikh ʿAbd al-Muḥsin al-ʿAbbād
     (nuqayah.com/f/abbad.pdf) — the shorter, clearly-legible ones, chosen
     to transcribe accurately. One rotates in per day. */
  var DUAS = [
    { ar: 'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ', src: 'سيد الاستغفار — رواه البخاري (٦٣٠٦) عن شداد بن أوس رضي الله عنه' },
    { ar: 'اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ', src: 'رواه البخاري (٨٣٤) ومسلم (٦٨٦٩) عن أبي بكر رضي الله عنه' },
    { ar: 'اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ، وَجِلَّهُ، وَأَوَّلَهُ، وَآخِرَهُ، وَعَلَانِيَتَهُ، وَسِرَّهُ', src: 'رواه مسلم (١٠٨٤) عن أبي هريرة رضي الله عنه' },
    { ar: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ وَمِنْ شَرِّ مَا لَمْ أَعْمَلْ', src: 'رواه مسلم (٦٨٩٥) عن عائشة رضي الله عنها' },
    { ar: 'اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ', src: 'رواه مسلم (٦٩٠٣) عن أبي هريرة رضي الله عنه' },
    { ar: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى', src: 'رواه مسلم (٦٩٠٤) عن ابن مسعود رضي الله عنه' },
    { ar: 'اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ', src: 'رواه مسلم (٦٧٥٠) عن عبد الله بن عمرو رضي الله عنهما' },
    { ar: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ وَتَحَوُّلِ عَافِيَتِكَ وَفُجَاءَةِ نِقْمَتِكَ وَجَمِيعِ سَخَطِكَ', src: 'رواه مسلم (٦٩٤٣) عن ابن عمر رضي الله عنهما' },
    { ar: 'اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ', src: 'رواه الترمذي (٣٣٩٢) وغيره بإسناد صحيح عن أبي هريرة رضي الله عنه' },
    { ar: 'اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ', src: 'رواه الترمذي (٣٥٦٣) بإسناد حسن عن علي، وانظر السلسلة الصحيحة للألباني (٢٦٦)' }
  ];

  function renderDua(){
    var d = pickRotating(DUAS, 1)[0];
    if(!d){ els.dua.innerHTML = ''; return; }
    els.dua.innerHTML =
      '<div class="dua-ar" lang="ar" dir="rtl">' + d.ar + '</div>' +
      '<div class="dua-src" lang="ar" dir="rtl">' + d.src + '</div>';
  }

  function isPending(t){ return !!(t.dependency && t.dependency.trim()); }

  /* "Today" / "Tomorrow" / "N days ago" bucket for a given ISO date,
     relative to today — each overdue date gets its own bucket (not one
     lumped "Overdue") so the exact lateness is always visible in the
     header itself. */
  function dayInfo(iso, todayISO){
    var d = new Date(iso + 'T00:00:00');
    var today = new Date(todayISO + 'T00:00:00');
    var diff = Math.round((d - today) / 86400000);
    var dateStr = d.toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'});
    var label;
    if(diff === 0) label = 'Today';
    else if(diff === 1) label = 'Tomorrow';
    else if(diff === -1) label = dateStr + ' · Yesterday';
    else if(diff < -1) label = dateStr + ' · ' + Math.abs(diff) + ' days ago';
    else label = dateStr;
    return {label: label, diff: diff};
  }

  function render(){
    renderDua();
    renderAssistant();

    var todayStr = L.todayISO();
    var horizon = new Date(todayStr + 'T00:00:00');
    horizon.setDate(horizon.getDate() + 6);
    var horizonStr = L.fmtISO(horizon);

    var buckets = {}; // label -> {order, diff, items:[]}
    function pushItem(dateKey, order, item){
      var label, diff;
      if(dateKey === 'reading'){ label = 'Worth a Read'; diff = 9999; }
      else { var info = dayInfo(dateKey, todayStr); label = info.label; diff = info.diff; }
      if(!buckets[label]) buckets[label] = {order: dateKey === 'reading' ? 9999 : order, diff: diff, items: []};
      buckets[label].items.push(item);
    }

    L.state.tasks.filter(function(t){
      return !t.archived && !t.struck && t.due && t.due <= horizonStr;
    }).forEach(function(t){
      var overdue = t.due < todayStr;
      var pending = overdue && isPending(t);
      pushItem(t.due, t.due, {
        href: 'tasks.html#task-' + t.id,
        text: t.description || 'Untitled',
        meta: pending ? ('Pending · ' + t.dependency) : '',
        cls: pending ? 'is-pending' : (overdue ? 'is-overdue' : '')
      });
    });

    L.Events.state.tasks.filter(function(t){
      return !t.archived && !t.struck && t.due && t.due >= todayStr && t.due <= horizonStr;
    }).forEach(function(t){
      pushItem(t.due, t.due, {
        href: 'events.html#task-' + t.id,
        text: t.description || 'Untitled',
        meta: t.details || '',
        cls: 'is-event'
      });
    });

    L.callsState.items.filter(function(c){
      if(c.status === 'watch' || c.mine === 'skip') return false;
      var d = L.daysUntil(c.deadline);
      return d !== null && d >= 0 && d <= 6;
    }).forEach(function(c){
      var d = L.daysUntil(c.deadline);
      pushItem(c.deadline, c.deadline, {
        href: 'calls.html#call-' + c.id,
        text: c.name,
        meta: d === 0 ? 'Today' : (d + 'd left'),
        cls: 'is-call'
      });
    });

    var pool = L.readingState.items.filter(function(r){ return r.title && r.status !== 'finished'; });
    var pick = pickRotating(pool, 1)[0];
    if(pick){
      pushItem('reading', 9999, {
        href: 'reading.html#task-' + pick.id,
        text: pick.title,
        meta: pick.author || '',
        cls: 'is-reading'
      });
    }

    var labels = Object.keys(buckets).sort(function(a,b){ return buckets[a].order < buckets[b].order ? -1 : 1; });

    if(!labels.length){
      els.days.innerHTML = '<div class="home-empty">A quiet few days ahead.</div>';
      return;
    }

    els.days.innerHTML = labels.map(function(label){
      var b = buckets[label];
      var late = b.diff < 0 && b.diff > -9000;
      /* The further overdue a bucket's date, the bigger/more intense its
         timeline node — a quick-glance read of "how overdue" beyond the
         day count in the header. */
      var sev = late ? Math.min(1, Math.abs(b.diff) / 21) : 0;
      var nodeStyle = late
        ? 'style="width:' + (8 + sev*7).toFixed(0) + 'px;height:' + (8 + sev*7).toFixed(0) + 'px;background:var(--overdue);border-color:var(--overdue);opacity:' + (0.55 + sev*0.45).toFixed(2) + '"'
        : '';
      return '<div class="day-group' + (late ? ' is-late' : '') + '">' +
        '<div class="day-group-label"><span class="day-node" ' + nodeStyle + '></span>' + L.escapeHTML(label) + '</div>' +
        b.items.map(function(it){
          return '<a class="day-item ' + it.cls + '" href="' + it.href + '">' +
            '<span class="day-item-dot"></span>' +
            '<span class="day-item-text">' + L.escapeHTML(it.text) +
            (it.meta ? '<span class="day-item-meta">' + L.escapeHTML(it.meta) + '</span>' : '') +
            '</span>' +
            '</a>';
        }).join('') +
        '</div>';
    }).join('');
  }


  // ---------- small helpers ----------
  function addDaysISO(iso, n){
    var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return L.fmtISO(d);
  }
  function diffDays(a, b){ return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
  function prettyDate(iso){
    return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
  }

  var toastTimer = null;
  function toast(msg, undo){
    var el = document.getElementById('toast');
    el.innerHTML = '<span>' + L.escapeHTML(msg) + '</span>' + (undo ? '<button type="button" id="toastundo">Undo</button>' : '');
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 6000);
    if(undo){
      document.getElementById('toastundo').addEventListener('click', function(){
        (typeof undo === 'function' ? undo : L.undo)();
        el.classList.remove('show');
      });
    }
  }

  // ---------- quick add ----------
  var MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  var WEEKDAYS = {sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6};
  var MON_RE = '(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*';

  /* Pulls a due date (and a #category) out of what was typed, so
     "email Laura tomorrow #SAT" becomes the task "email Laura", due
     tomorrow, category SAT. Short weekday names (sat, mon…) only count
     after "by/on/due/before" so a word like "SAT" isn't taken as Saturday. */
  function parseQuick(text){
    var today = L.todayISO(), lead = '(?:\\b(?:by|on|due|before)\\s+)?';
    var date = '', cut = '', rest = text;
    function take(re, fn){
      if(date) return;
      var m = re.exec(rest);
      if(!m) return;
      var d = fn(m);
      if(d){ date = d; cut = m[0]; }
    }
    function monthDay(mon, day){
      var d = parseInt(day, 10);
      if(!(d >= 1 && d <= 31)) return '';
      var now = new Date(today + 'T00:00:00'), y = now.getFullYear();
      var cand = new Date(y, MONTHS[mon.slice(0,3).toLowerCase()], d);
      if(cand.getDate() !== d) return '';
      if(L.fmtISO(cand) < today) cand = new Date(y + 1, MONTHS[mon.slice(0,3).toLowerCase()], d);
      return L.fmtISO(cand);
    }
    function nextWeekday(name){
      var target = WEEKDAYS[name.toLowerCase()];
      var cur = new Date(today + 'T00:00:00').getDay();
      var delta = (target - cur + 7) % 7;
      return addDaysISO(today, delta === 0 ? 7 : delta);
    }
    take(new RegExp(lead + '\\b(\\d{4}-\\d{2}-\\d{2})\\b', 'i'), function(m){ return m[1]; });
    take(new RegExp(lead + '\\b(?:today|tonight)\\b', 'i'), function(){ return today; });
    take(new RegExp(lead + '\\b(?:tomorrow|tmrw)\\b', 'i'), function(){ return addDaysISO(today, 1); });
    take(new RegExp(lead + '\\bnext week\\b', 'i'), function(){ return addDaysISO(today, 7); });
    take(new RegExp(lead + '\\bin (\\d{1,2}) days?\\b', 'i'), function(m){ return addDaysISO(today, parseInt(m[1], 10)); });
    take(new RegExp(lead + '\\b' + MON_RE + '\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b', 'i'), function(m){ return monthDay(m[1], m[2]); });
    take(new RegExp(lead + '\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+' + MON_RE + '\\b', 'i'), function(m){ return monthDay(m[2], m[1]); });
    take(/\b(?:next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i, function(m){ return nextWeekday(m[1]); });
    take(/\b(?:by|on|due|before)\s+(?:next\s+)?(sun|mon|tues?|wed|thur?s?|fri|sat)\b/i, function(m){ return nextWeekday(m[1]); });
    if(cut) rest = rest.replace(cut, ' ');

    var category = '';
    var tag = /(?:^|\s)#([\w-]+)/.exec(rest);
    if(tag){
      var typed = tag[1];
      var known = {};
      L.state.tasks.forEach(function(t){ if(t.category) known[t.category.toLowerCase()] = t.category; });
      category = known[typed.toLowerCase()] || typed;
      rest = rest.replace(tag[0], ' ');
    }
    var desc = rest.replace(/\s+/g, ' ').replace(/^[\s,.\-–—:;]+|[\s,.\-–—:;]+$/g, '');
    return {desc: desc || text.trim(), due: date, category: category};
  }

  var qaForm = document.getElementById('qaform');
  var qaText = document.getElementById('qatext');
  var qaDate = document.getElementById('qadate');
  var qaBtn = document.getElementById('qabtn');
  var qaHint = document.getElementById('qahint');
  var DEFAULT_HINT = qaHint.textContent;
  var manualDate = false;

  function updateQuickHint(){
    var raw = qaText.value;
    if(!raw.trim()){ qaHint.textContent = DEFAULT_HINT; if(!manualDate) qaDate.value = ''; return; }
    var p = parseQuick(raw);
    if(!manualDate) qaDate.value = p.due;
    var due = qaDate.value;
    var bits = [];
    if(due) bits.push('Due ' + prettyDate(due));
    if(p.category) bits.push('Category ' + p.category);
    qaHint.textContent = bits.length ? bits.join(' · ') : 'No due date. That\'s fine, you can add one later.';
  }
  qaText.addEventListener('input', updateQuickHint);
  qaDate.addEventListener('change', function(){
    manualDate = !!qaDate.value;
    updateQuickHint();
  });
  qaForm.querySelector('.qa-chips').addEventListener('click', function(e){
    var b = e.target.closest('button[data-d]');
    if(!b) return;
    qaDate.value = addDaysISO(L.todayISO(), parseInt(b.dataset.d, 10));
    manualDate = true;
    updateQuickHint();
    qaText.focus();
  });
  qaForm.addEventListener('submit', function(e){
    e.preventDefault();
    var raw = qaText.value.trim();
    if(!raw) return;
    var p = parseQuick(raw), due = qaDate.value;
    qaBtn.disabled = true;
    L.addTask({description: p.desc, due: due, category: p.category}).then(function(r){
      qaText.value = ''; qaDate.value = ''; manualDate = false;
      updateQuickHint();
      toast('Added ' + r.no + ' · ' + p.desc + (due ? ' · due ' + prettyDate(due) : ''), true);
    }).catch(function(err){
      console.error(err);
      toast('Could not add that. Check your connection and try again.', false);
    }).then(function(){ qaBtn.disabled = false; qaText.focus(); });
  });

  // ---------- quick questions (the little assistant) ----------
  /* Looks through the live task list for things that are stuck and asks
     one plain question about each, with buttons that make the change
     right here. Nothing is guessed: every change comes from a button
     press, and "Not now" hides a question until tomorrow. */
  var DISMISS_KEY = 'badriyah-assistant-dismissed-v1';
  var openMode = null; // {qid, mode}
  var showAll = false;

  function loadDismissed(){
    var today = L.todayISO();
    try {
      var o = JSON.parse(localStorage.getItem(DISMISS_KEY) || 'null');
      if(o && o.day === today) return o;
    } catch(e){}
    return {day: today, keys: [], someday: (function(){ try { return (JSON.parse(localStorage.getItem(DISMISS_KEY) || 'null') || {}).someday || []; } catch(e){ return []; } })()};
  }
  function saveDismissed(o){ try { localStorage.setItem(DISMISS_KEY, JSON.stringify(o)); } catch(e){} }
  function dismissQuestion(qid, forever){
    var o = loadDismissed();
    (forever ? o.someday : o.keys).push(qid);
    saveDismissed(o);
  }

  function buildQuestions(){
    var T = L.todayISO();
    var tasks = L.state.tasks.filter(function(t){ return !t.archived && !t.struck; });
    function leaf(t){ return !L.hasChildren(t.no); }
    var by = {today: [], overdue: [], waiting: [], callsub: [], call: [], event: [], step: [], nodue: [], nodep: [], parentdone: [], reading: [], prompt: []};

    tasks.filter(function(t){ return t.due && t.due < T && leaf(t) && !isPending(t); })
      .sort(function(a, b){ return a.due < b.due ? -1 : 1; })
      .forEach(function(t){ by.overdue.push({qid: 'ovr:' + t.id, type: 'overdue', t: t}); });

    tasks.filter(function(t){ return t.due && t.due < T && leaf(t) && isPending(t) && diffDays(t.due, T) >= 4; })
      .sort(function(a, b){ return a.due < b.due ? -1 : 1; })
      .forEach(function(t){ by.waiting.push({qid: 'wait:' + t.id, type: 'waiting', t: t}); });

    L.callsState.items.filter(function(c){
      var d = L.daysUntil(c.deadline);
      return !c.mine && c.status !== 'watch' && d !== null && d >= 0 && d <= 7;
    }).sort(function(a, b){ return L.daysUntil(a.deadline) - L.daysUntil(b.deadline); })
      .forEach(function(c){ by.call.push({qid: 'call:' + c.id, type: 'call', c: c}); });

    tasks.filter(function(t){
      var d = t.due ? diffDays(T, t.due) : -1;
      return d >= 1 && d <= 5 && leaf(t) && !isPending(t) && !(t.details || '').trim();
    }).sort(function(a, b){ return a.due < b.due ? -1 : 1; })
      .forEach(function(t){ by.step.push({qid: 'step:' + t.id, type: 'step', t: t}); });

    var undated = tasks.filter(function(t){ return !t.due && leaf(t) && !isPending(t) && (t.description || '').trim(); });
    if(undated.length){
      var t0 = undated[Math.floor(new Date().getTime() / 86400000) % undated.length];
      by.nodue.push({qid: 'nodue:' + t0.id, type: 'nodue', t: t0});
    }


    tasks.filter(function(t){ return t.due === T && leaf(t); })
      .forEach(function(t){ by.today.push({qid: 'today:' + t.id, type: 'today', t: t}); });

    tasks.filter(function(t){ return !t.due && leaf(t) && isPending(t); })
      .forEach(function(t){ by.nodep.push({qid: 'nodep:' + t.id, type: 'nodep', t: t}); });

    L.state.tasks.filter(function(t){ return !t.archived && !t.struck && t.no && L.hasChildren(t.no); }).forEach(function(t){
      var kids = L.state.tasks.filter(function(x){ return x.no && x.no.indexOf(t.no + '.') === 0; });
      if(kids.length && kids.every(function(x){ return x.struck || x.archived; })){
        by.parentdone.push({qid: 'pdone:' + t.id, type: 'parentdone', t: t});
      }
    });

    L.callsState.items.filter(function(c){
      var d = L.daysUntil(c.deadline);
      return c.mine === 'planning' && d !== null && d >= 0 && d <= 14;
    }).sort(function(a, b){ return L.daysUntil(a.deadline) - L.daysUntil(b.deadline); })
      .forEach(function(c){ by.callsub.push({qid: 'callsub:' + c.id, type: 'callsub', c: c}); });

    L.Events.state.tasks.filter(function(e){
      var d = e.due ? diffDays(T, e.due) : -1;
      return !e.archived && !e.struck && d >= 0 && d <= 3;
    }).sort(function(a, b){ return a.due < b.due ? -1 : 1; })
      .forEach(function(e){ by.event.push({qid: 'event:' + e.id, type: 'event', o: e}); });

    L.readingState.items.filter(function(r){ return r.status === 'reading' && r.title; })
      .forEach(function(r){ by.reading.push({qid: 'read:' + r.id, type: 'reading', o: r}); });

    // One reflective prompt a day, so there is always a way to get something out of your head.
    var PROMPTS = [
      {text: 'What’s one thing you’ve been putting off?', ph: 'e.g. call the ministry about the license', due: 1},
      {text: 'Anything on your mind that isn’t written down yet?', ph: 'Type it here and it becomes a task', due: 0},
      {text: 'What would make tomorrow easier if you did it tonight?', ph: 'e.g. lay out the files for the Sharjah submission', due: 1}
    ];
    var pi = Math.floor(new Date().getTime() / 86400000) % PROMPTS.length;
    by.prompt.push({qid: 'prompt:' + T, type: 'prompt', p: PROMPTS[pi]});

    // Keep the chatty types short so the list stays a few quick decisions, not a chore.
    ['today', 'callsub', 'event', 'reading'].forEach(function(k){ by[k] = by[k].slice(0, 2); });

    // Round-robin across types so one kind of question doesn't crowd out the rest.
    var order = ['today', 'overdue', 'waiting', 'callsub', 'call', 'event', 'step', 'nodep', 'parentdone', 'nodue', 'reading', 'prompt'], out = [], i = 0, more = true;
    while(more){
      more = false;
      order.forEach(function(k){ if(by[k][i]){ out.push(by[k][i]); more = true; } });
      i++;
    }
    var dis = loadDismissed();
    return out.filter(function(q){ return dis.keys.indexOf(q.qid) === -1 && dis.someday.indexOf(q.qid) === -1; });
  }

  function chipsHTML(extraAttr){
    return '<span class="q-chips">' +
      '<button type="button" data-a="moveto" data-days="1"' + extraAttr + '>Tomorrow</button>' +
      '<button type="button" data-a="moveto" data-days="3"' + extraAttr + '>In 3 days</button>' +
      '<button type="button" data-a="moveto" data-days="7"' + extraAttr + '>Next week</button>' +
      '<input type="date" data-a="movedate" aria-label="Pick a date">' +
      '</span>';
  }
  function questionHTML(q){
    var name = function(t){ return '<b>“' + L.escapeHTML(t.description || 'Untitled') + '”</b>'; };
    var open = openMode && openMode.qid === q.qid ? openMode.mode : null;
    var text = '', actions = '', extra = '';
    var skip = '<button type="button" class="q-skip" data-a="skip">Not now</button>';
    if(q.type === 'overdue'){
      var n = diffDays(q.t.due, L.todayISO());
      text = 'Is ' + name(q.t) + ' done, waiting on someone, or still yours? <span class="q-meta">' + n + (n === 1 ? ' day' : ' days') + ' overdue</span>';
      actions = '<button type="button" data-a="done">Done</button><button type="button" data-a="wait">Waiting on someone</button>' +
        '<button type="button" data-a="move">Move the date</button><button type="button" data-a="step">First step</button>' +
        '<button type="button" data-a="drop">Drop it</button>' + skip;
    } else if(q.type === 'waiting'){
      var w = diffDays(q.t.due, L.todayISO());
      text = 'You’re waiting on <b>' + L.escapeHTML(q.t.dependency) + '</b> for ' + name(q.t) + '. Have you followed up? <span class="q-meta">' + w + ' days past its date</span>';
      actions = '<button type="button" data-a="done">It’s sorted</button><button type="button" data-a="followed">I followed up</button>' +
        '<button type="button" data-a="nudge">Nudge me tomorrow</button>' + skip;
    } else if(q.type === 'step'){
      var dd = diffDays(L.todayISO(), q.t.due);
      text = name(q.t) + ' is due ' + (dd === 1 ? 'tomorrow' : 'in ' + dd + ' days') + ' and has no notes yet. What’s the very first step?';
      actions = '<button type="button" data-a="step">Add the first step</button><button type="button" data-a="move">Move the date</button>' + skip;
    } else if(q.type === 'call'){
      var cd = L.daysUntil(q.c.deadline);
      text = 'Are you applying to <b>“' + L.escapeHTML(q.c.name) + '”</b>? <span class="q-meta">Closes ' + (cd === 0 ? 'today' : 'in ' + cd + (cd === 1 ? ' day' : ' days')) + '</span>';
      actions = '<button type="button" data-a="callyes">Yes, plan it</button><button type="button" data-a="callno">No, skip it</button>' + skip;
    } else if(q.type === 'nodue'){
      text = 'When should ' + name(q.t) + ' happen? <span class="q-meta">No date yet</span>';
      actions = chipsHTML('') + '<button type="button" class="q-skip" data-a="someday">Someday</button>' + skip;
    } else if(q.type === 'today'){
      text = 'Will you finish ' + name(q.t) + ' today? <span class="q-meta" style="color:var(--muted)">Due today</span>';
      actions = '<button type="button" data-a="done">Already done</button><button type="button" data-a="skip">Yes, on it</button>' +
        '<button type="button" data-a="move">Move the date</button><button type="button" data-a="wait">Blocked by someone</button>';
    } else if(q.type === 'nodep'){
      text = 'You’re waiting on <b>' + L.escapeHTML(q.t.dependency) + '</b> for ' + name(q.t) + '. When will you check in? <span class="q-meta" style="color:var(--muted)">No date yet</span>';
      actions = chipsHTML('') + skip;
    } else if(q.type === 'parentdone'){
      text = 'Everything under ' + name(q.t) + ' is done. Mark the whole thing done?';
      actions = '<button type="button" data-a="done">Yes, mark it done</button>' + skip;
    } else if(q.type === 'callsub'){
      var sd = L.daysUntil(q.c.deadline);
      text = 'Have you submitted <b>“' + L.escapeHTML(q.c.name) + '”</b>? <span class="q-meta">Closes ' + (sd === 0 ? 'today' : 'in ' + sd + (sd === 1 ? ' day' : ' days')) + '</span>';
      actions = '<button type="button" data-a="callsubmitted">Yes, submitted</button><button type="button" data-a="skip">Still working on it</button>' +
        '<button type="button" data-a="callno">Drop it</button>';
    } else if(q.type === 'event'){
      var ed = diffDays(L.todayISO(), q.o.due);
      text = 'Are you going to <b>“' + L.escapeHTML(q.o.description || 'Untitled') + '”</b>? <span class="q-meta" style="color:var(--muted)">' + (ed === 0 ? 'Today' : ed === 1 ? 'Tomorrow' : prettyDate(q.o.due)) + '</span>';
      actions = '<button type="button" data-a="eventyes">Yes</button><button type="button" data-a="eventno">No, clear it</button>' + skip;
    } else if(q.type === 'reading'){
      text = 'Still reading <b>“' + L.escapeHTML(q.o.title) + '”</b>?' + (q.o.author ? ' <span class="q-meta" style="color:var(--muted)">' + L.escapeHTML(q.o.author) + '</span>' : '');
      actions = '<button type="button" data-a="readfinished">Finished it</button><button type="button" data-a="skip">Still reading</button>' +
        '<button type="button" data-a="readback">Put it back</button>';
    } else if(q.type === 'prompt'){
      text = q.p.text;
      extra = '<form class="q-form" data-a="saveprompt"><input type="text" placeholder="' + L.escapeHTML(q.p.ph) + '" aria-label="Your answer"><button type="submit">Add as task</button></form>';
      actions = skip;
    }
    if(open === 'wait'){
      extra = '<form class="q-form" data-a="savewait"><input type="text" placeholder="Who or what are you waiting on?" aria-label="Waiting on"><button type="submit">Save</button></form>';
    } else if(open === 'move'){
      extra = chipsHTML('');
    } else if(open === 'step'){
      extra = '<form class="q-form" data-a="savestep"><input type="text" placeholder="e.g. open the form and read the requirements" aria-label="First step"><button type="submit">Add as sub-task</button></form>';
    }
    return '<div class="q" data-qid="' + q.qid + '" data-id="' + ((q.t || q.c || q.o || {}).id || '') + '" data-type="' + q.type + '" data-due="' + (q.p ? q.p.due : '') + '">' +
      '<div class="q-text">' + text + '</div>' +
      '<div class="q-actions">' + actions + '</div>' +
      (extra ? '<div class="q-extra">' + extra + '</div>' : '') +
      '</div>';
  }

  var assistBody = document.getElementById('assistbody');
  var assistCount = document.getElementById('assistcount');
  var assistEl = document.getElementById('assist');
  function renderAssistant(){
    var ae = document.activeElement;
    if(ae && assistBody.contains(ae) && ae.tagName === 'INPUT') return; // don't wipe what she's typing
    if(!L.state.tasks.length){ assistEl.style.display = 'none'; return; }
    assistEl.style.display = '';
    var qs = buildQuestions();
    assistCount.textContent = qs.length ? String(qs.length) : '';
    if(!qs.length){
      assistBody.innerHTML = '<div class="q-none">Nothing needs a decision right now.</div>';
      return;
    }
    var shown = showAll ? qs : qs.slice(0, 3);
    assistBody.innerHTML = shown.map(questionHTML).join('') +
      (qs.length > 3 ? '<button type="button" class="q-more" data-a="more">' + (showAll ? 'Show fewer' : 'Show ' + (qs.length - 3) + ' more') + '</button>' : '');
  }

  function applyDue(id, iso, label){
    L.updateField(id, 'due', iso);
    toast((label || 'Moved') + ' to ' + prettyDate(iso), true);
  }

  assistBody.addEventListener('click', function(e){
    var more = e.target.closest('button[data-a="more"]');
    if(more){ showAll = !showAll; renderAssistant(); return; }
    var btn = e.target.closest('button[data-a]');
    if(!btn || btn.closest('form')) return;
    var card = btn.closest('.q'); if(!card) return;
    var id = card.dataset.id, qid = card.dataset.qid, a = btn.dataset.a, T = L.todayISO();
    var task = L.state.tasks.find(function(t){ return t.id === id; });
    if(a === 'done'){ L.toggleStrike(id); toast('Marked done', true); }
    else if(a === 'wait' || a === 'move' || a === 'step'){
      openMode = (openMode && openMode.qid === qid && openMode.mode === a) ? null : {qid: qid, mode: a};
      renderAssistant();
      var inp = assistBody.querySelector('.q[data-qid="' + qid + '"] .q-form input');
      if(inp) inp.focus();
    }
    else if(a === 'moveto'){ applyDue(id, addDaysISO(T, parseInt(btn.dataset.days, 10))); openMode = null; }
    else if(a === 'followed'){
      var note = ((task && task.details) ? task.details + ' · ' : '') + 'Followed up ' + prettyDate(T);
      L.updateField(id, 'details', note);
      applyDue(id, addDaysISO(T, 3), 'Checking again');
    }
    else if(a === 'nudge'){ applyDue(id, addDaysISO(T, 1), 'Moved'); }
    else if(a === 'callyes'){ L.setCallMine(id, 'planning'); toast('Added to your tasks (Planning)', false); }
    else if(a === 'callno'){ L.setCallMine(id, 'skip'); toast('Skipped', false); }
    else if(a === 'drop'){ L.archiveTask(id); toast('Dropped. You can find it in Archive', true); }
    else if(a === 'callsubmitted'){ L.setCallMine(id, 'submitted'); toast('Marked as submitted', false); }
    else if(a === 'eventyes'){ dismissQuestion(qid, true); renderAssistant(); }
    else if(a === 'eventno'){ L.Events.toggleStrike(id); toast('Cleared from your events', function(){ L.Events.undo(); }); }
    else if(a === 'readfinished'){ L.setReadingStatus(id, 'finished'); toast('Marked as finished', false); }
    else if(a === 'readback'){ L.setReadingStatus(id, 'not-started'); toast('Moved back to not started', false); }
    else if(a === 'someday'){ dismissQuestion(qid, true); renderAssistant(); }
    else if(a === 'skip'){ dismissQuestion(qid, false); openMode = null; renderAssistant(); }
  });
  assistBody.addEventListener('change', function(e){
    var el = e.target;
    if(el.matches && el.matches('input[type="date"][data-a="movedate"]') && el.value){
      var card = el.closest('.q');
      applyDue(card.dataset.id, el.value);
      openMode = null;
      el.blur();
      renderAssistant();
    }
  });
  assistBody.addEventListener('submit', function(e){
    e.preventDefault();
    var form = e.target, card = form.closest('.q');
    var val = form.querySelector('input').value.trim();
    if(!val) return;
    var id = card.dataset.id;
    if(form.dataset.a === 'saveprompt'){
      var pdue = card.dataset.due === '1' ? addDaysISO(L.todayISO(), 1) : '';
      L.addTask({description: val, due: pdue}).then(function(r){
        toast('Added ' + r.no + ' · ' + val + (pdue ? ' · due ' + prettyDate(pdue) : ''), true);
      });
      dismissQuestion(card.dataset.qid, false);
      form.querySelector('input').blur();
      renderAssistant();
      return;
    }
    if(form.dataset.a === 'savewait'){
      L.updateField(id, 'dependency', val);
      toast('Marked as waiting on ' + val, true);
    } else if(form.dataset.a === 'savestep'){
      L.addChildTask(id, {description: val, due: L.todayISO()}).then(function(r){
        toast('Added ' + r.no + ' for today', true);
      });
    }
    openMode = null;
    form.querySelector('input').blur();
    renderAssistant();
  });
  assistBody.addEventListener('focusout', function(){
    setTimeout(function(){ if(!assistBody.contains(document.activeElement)) renderAssistant(); }, 0);
  });

  L.onChange(render);
  L.Events.onChange(render);
  L.onCallsChange(render);
  L.onReadingChange(render);
})();
</script>
</body>
</html>
