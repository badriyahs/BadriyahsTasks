<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badriyah's Tasks — Tasks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=12">
</head>
<body>

<div class="topbar">
  <h1>Badriyah's Tasks</h1>
  <div class="sub"><span class="dot off" id="syncdot"></span><span id="syncstate">Connecting…</span></div>
  <div class="spacer"></div>
  <div class="undoredo">
    <button id="undobtn" title="Undo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
    <button id="redobtn" title="Redo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg></button>
  </div></div>

<div class="view" id="view-tasks">
  <div class="toolbar">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchbox" type="text" placeholder="Search tasks, owners, details…" autocomplete="off">
    </div>
    <div class="chips" id="catchips"></div>
    <div class="count" id="rowcount"></div>
  </div>
  <div class="sheet-scroll">
    <div class="sheet" id="sheet">
      <div class="row head">
        <div class="cell">No.</div>
        <div class="cell">Category</div>
        <div class="cell">Description</div>
        <div class="cell">Due Date</div>
        <div class="cell">Link</div>
        <div class="cell">Dependency</div>
        <div class="cell">Owner</div>
        <div class="cell">Details</div>
        <div class="cell"></div>
      </div>
      <!-- rows injected here -->
    </div>
  </div>
</div>

<div class="tabbar">
  <a class="tab active" href="index.html">Tasks</a>
  <a class="tab" href="calendar.html">Calendar</a>
  <a class="tab" href="archive.html">Archive</a>
  <a class="tab" href="activity.html">Activity</a>
  <a class="tab" href="reading.html">Reading</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="app.js?v=13"></script>
<script>
(function(){
  "use strict";
  var L = window.Ledger;
  L.wireTopbar();

  var els = {
    sheet: document.getElementById('sheet'),
    catchips: document.getElementById('catchips'),
    rowcount: document.getElementById('rowcount'),
    searchbox: document.getElementById('searchbox'),
    syncdot: document.getElementById('syncdot'),
    syncstate: document.getElementById('syncstate')
  };

  var search = '';
  var catFilter = null;

  L.onStatus(function(kind, text){
    els.syncdot.classList.remove('off','err');
    if(kind !== 'ok') els.syncdot.classList.add(kind);
    els.syncstate.textContent = text;
  });

  els.searchbox.addEventListener('input', function(){
    search = els.searchbox.value.trim().toLowerCase();
    render();
  });

  function matches(t){
    if(catFilter && t.category !== catFilter) return false;
    if(!search) return true;
    var hay = [t.no,t.category,t.description,t.owner,t.dependency,t.details,t.link].join(' ').toLowerCase();
    return hay.indexOf(search) !== -1;
  }

  function renderChips(activeTasks){
    var cats = [];
    activeTasks.forEach(function(t){ if(t.category && cats.indexOf(t.category)===-1) cats.push(t.category); });
    els.catchips.innerHTML = cats.map(function(c){
      var s = L.catClassStyle(c);
      var active = catFilter === c;
      return '<button class="chip'+(active?' active':'')+'" data-cat="'+L.escapeHTML(c)+'" style="background:'+s.bg+';color:'+s.fg+'">'+L.escapeHTML(c)+'</button>';
    }).join('');
    els.catchips.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        var c = chip.dataset.cat;
        catFilter = (catFilter === c) ? null : c;
        render();
      });
    });
  }

  function render(){
    var activeTasks = L.state.tasks.filter(function(t){ return !t.archived; });
    renderChips(activeTasks);
    var visible = activeTasks.filter(matches);
    els.rowcount.textContent = visible.length + (visible.length===1?' task':' tasks');

    var rowsHTML = visible.map(function(t){ return L.rowHTML(t, 'active', null); }).join('');
    var addRowHTML = '<div class="addrow"><button id="addtaskbtn">+ Add task</button></div>';
    var headHTML = els.sheet.querySelector('.row.head').outerHTML;
    L.preserveFocus(els.sheet, function(){
      els.sheet.innerHTML = headHTML + (rowsHTML || '<div class="empty-hint" style="grid-column:1/-1;">No tasks match — try clearing the search or filter.</div>') + addRowHTML;
    });

    var btn = document.getElementById('addtaskbtn');
    if(btn) btn.addEventListener('click', L.addTopLevel);

    var focusId = L.focusIdOnce();
    if(focusId){
      requestAnimationFrame(function(){
        var el = els.sheet.querySelector('.desc-text[data-id="'+focusId+'"]');
        if(el){ el.focus(); }
      });
    }

    jumpToHash();
  }

  var jumped = false;
  function jumpToHash(){
    if(jumped) return;
    var m = /^#task-(.+)$/.exec(location.hash);
    if(!m) return;
    var row = els.sheet.querySelector('.row[data-row-id="'+m[1]+'"]');
    if(!row) return;
    jumped = true;
    requestAnimationFrame(function(){
      row.scrollIntoView({block:'center', behavior:'smooth'});
      row.querySelectorAll('.cell').forEach(function(c){ c.classList.add('flash'); });
      setTimeout(function(){ row.querySelectorAll('.cell').forEach(function(c){ c.classList.remove('flash'); }); }, 1700);
    });
  }

  // ---------- event delegation ----------
  L.wireEditing(els.sheet);
  els.sheet.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action]');
    if(!btn) return;
    var action = btn.dataset.action, id = btn.dataset.id;
    if(action === 'addsub'){ L.addSiblingAfter(id); }
    else if(action === 'strike'){ L.toggleStrike(id); }
    else if(action === 'archive'){ L.archiveTask(id); }
  });

  L.onChange(render);
})();
</script>
</body>
</html>
