<div class="topbar">
  <h1>Badriyah's Tasks</h1>
  <div class="sub"><span class="dot off" id="syncdot"></span><span id="syncstate">Connecting…</span></div>
  <div class="spacer"></div>
</div>

<main class="lb" id="lb">
  <header class="lb-head">
    <nav class="lb-seg" id="lbnav" aria-label="Library">
      <button type="button" data-view="shelf" class="on" aria-pressed="true">Shelf</button>
      <button type="button" data-view="notes" aria-pressed="false">Notes</button>
      <button type="button" data-view="cite" aria-pressed="false">Cite</button>
    </nav>
    <label class="lb-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="lbq" type="search" placeholder="Search everything" autocomplete="off" aria-label="Search sources, notes and highlights">
    </label>
    <button type="button" class="lb-add" id="lbadd" aria-label="Add">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add</span>
    </button>
  </header>

  <p class="lb-status" id="lbstatus" role="status" hidden></p>

  <section class="lb-view" id="v-shelf" aria-label="Shelf"></section>
  <section class="lb-view" id="v-notes" aria-label="Notes" hidden></section>
  <section class="lb-view" id="v-cite" aria-label="Cite" hidden></section>
  <section class="lb-view" id="v-search" aria-label="Search results" hidden></section>
</main>

<div class="lb-scrim" id="lbscrim" hidden></div>
<div class="lb-sheet" id="lbsheet" role="dialog" aria-modal="true" aria-label="Details" hidden></div>

<div class="lb-reader" id="lbreader" role="dialog" aria-modal="true" aria-label="Reader" hidden>
  <div class="lb-rbar">
    <button type="button" class="lb-rbtn" id="rback" aria-label="Back to the shelf">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="lb-rtitle" id="rtitle"></div>
    <label class="lb-rpage"><span class="lb-sr">Page</span><input id="rpage" type="text" inputmode="numeric" value="1" aria-label="Page number"><span id="rtotal">/ 1</span></label>
    <button type="button" class="lb-rbtn" id="rzout" aria-label="Zoom out">−</button>
    <button type="button" class="lb-rbtn" id="rzin" aria-label="Zoom in">+</button>
    <button type="button" class="lb-rbtn lb-rtext" id="rnight" aria-label="Page colour">Night</button>
    <button type="button" class="lb-rbtn lb-rtext" id="rside" aria-label="Show highlights and notes">Marks <b id="rcount">0</b></button>
  </div>
  <div class="lb-rbody">
    <div class="lb-rhost" id="rhost"></div>
    <aside class="lb-rpanel" id="rpanel" hidden aria-label="Highlights and notes for this paper"></aside>
  </div>
  <div class="lb-seltb" id="seltb" hidden role="toolbar" aria-label="Mark the selected text">
    <button type="button" data-hl="idea" class="hl-idea">Idea</button>
    <button type="button" data-hl="evidence" class="hl-evidence">Evidence</button>
    <button type="button" data-hl="quote" class="hl-quote">Quote</button>
    <button type="button" data-hl="question" class="hl-question">Question</button>
    <button type="button" data-act="cite" class="hl-plain">Copy with citation</button>
  </div>
  <div class="lb-rempty" id="rempty" hidden></div>
</div>

<div class="lb-toast" id="lbtoast" role="status" aria-live="polite" hidden></div>
