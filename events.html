<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badriyah's Tasks — Events</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=38">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.85em%27 font-size=%2290%27 text-anchor=%27middle%27 x=%2750%27>%E2%9C%A7</text></svg>">
</head>
<body>
<div class="tabbar">
  <a class="tab" href="index.html">Today</a>
  <a class="tab" href="tasks.html">Tasks</a>
  <a class="tab" href="calendar.html">Calendar</a>
  <a class="tab" href="archive.html">Archive</a>
  <a class="tab" href="activity.html">Activity</a>
  <a class="tab" href="reading.html">Library</a>
  <a class="tab" href="notes.html">Notes</a>
  <a class="tab active" href="events.html">Events</a>
  <a class="tab" href="calls.html">Calls</a>
  <a class="tab" href="gre.html">GRE</a>
</div>

<div class="topbar">
  <h1>Badriyah's Tasks</h1>
  <div class="sub"><span class="dot off" id="syncdot"></span><span id="syncstate">Connecting…</span></div>
  <div class="spacer"></div>
  <div class="undoredo">
    <button id="undobtn" title="Undo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
    <button id="redobtn" title="Redo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg></button>
  </div>
</div>

<div class="view" id="view-events">
  <div class="toolbar">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchbox" type="text" placeholder="Search events, locations, details…" autocomplete="off">
    </div>
    <div class="chips" id="catchips"></div>
    <div class="count" id="rowcount"></div>
  </div>
  <div class="sheet-scroll">
    <div class="sheet" id="sheet">
      <div class="row head">
        <div class="cell">No.</div>
        <div class="cell">Category</div>
        <div class="cell">Description</div>
        <div class="cell">Due Date</div>
        <div class="cell">Link</div>
        <div class="cell">Dependency</div>
        <div class="cell">Owner</div>
        <div class="cell">Details</div>
        <div class="cell"></div>
      </div>
      <!-- rows injected here -->
    </div>
  </div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="app.js?v=21"></script>
<script>
(function(){
  "use strict";
  var L = window.Ledger;
  var Ev = L.Events;
  L.wireTopbar(Ev);

  var els = {
    sheet: document.getElementById('sheet'),
    catchips: document.getElementById('catchips'),
    rowcount: document.getElementById('rowcount'),
    searchbox: document.getElementById('searchbox'),
    syncdot: document.getElementById('syncdot'),
    syncstate: document.getElementById('syncstate')
  };

  var search = '';
  var catFilter = null;

  Ev.onStatus(function(kind, text){
    els.syncdot.classList.remove('off','err');
    if(kind !== 'ok') els.syncdot.classList.add(kind);
    els.syncstate.textContent = text;
  });

  els.searchbox.addEventListener('input', function(){
    search = els.searchbox.value.trim().toLowerCase();
    render();
  });

  function matches(t){
    if(catFilter && t.category !== catFilter) return false;
    if(!search) return true;
    var hay = [t.no,t.category,t.description,t.owner,t.dependency,t.details,t.link].join(' ').toLowerCase();
    return hay.indexOf(search) !== -1;
  }

  function renderChips(items){
    var cats = [];
    items.forEach(function(t){ if(t.category && cats.indexOf(t.category)===-1) cats.push(t.category); });
    els.catchips.innerHTML = cats.map(function(c){
      var s = L.catClassStyle(c);
      var active = catFilter === c;
      return '<button class="chip'+(active?' active':'')+'" data-cat="'+L.escapeHTML(c)+'" style="background:'+s.bg+';color:'+s.fg+'">'+L.escapeHTML(c)+'</button>';
    }).join('');
    els.catchips.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        var c = chip.dataset.cat;
        catFilter = (catFilter === c) ? null : c;
        render();
      });
    });
  }

  function render(){
    var items = Ev.state.tasks.filter(function(t){ return !t.archived; });
    renderChips(items);
    var visible = items.filter(matches);
    els.rowcount.textContent = visible.length + (visible.length===1?' event':' events');

    var rowsHTML = visible.map(function(t){ return Ev.rowHTML(t, 'active', confirmDeleteId); }).join('');
    var addRowHTML = '<div class="addrow"><button id="addbtn">+ Add event</button></div>';
    var headHTML = els.sheet.querySelector('.row.head').outerHTML;
    L.preserveFocus(els.sheet, function(){
      els.sheet.innerHTML = headHTML + (rowsHTML || '<div class="empty-hint" style="grid-column:1/-1;">No events match — try clearing the search or filter.</div>') + addRowHTML;
    });

    var btn = document.getElementById('addbtn');
    if(btn) btn.addEventListener('click', Ev.addTopLevel);

    var focusId = Ev.focusIdOnce();
    if(focusId){
      requestAnimationFrame(function(){
        var el = els.sheet.querySelector('.desc-text[data-id="'+focusId+'"]');
        if(el){ el.focus(); }
      });
    }

    jumpToHash();
  }

  var jumped = false;
  function jumpToHash(){
    if(jumped) return;
    var m = /^#task-(.+)$/.exec(location.hash);
    if(!m) return;
    var row = els.sheet.querySelector('.row[data-row-id="'+m[1]+'"]');
    if(!row) return;
    jumped = true;
    requestAnimationFrame(function(){
      row.scrollIntoView({block:'center', behavior:'smooth'});
      row.querySelectorAll('.cell').forEach(function(c){ c.classList.add('flash'); });
      setTimeout(function(){ row.querySelectorAll('.cell').forEach(function(c){ c.classList.remove('flash'); }); }, 1700);
    });
  }

  var confirmDeleteId = null;
  L.wireEditing(els.sheet, Ev.updateField);
  els.sheet.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action]');
    if(!btn) return;
    var action = btn.dataset.action, id = btn.dataset.id;
    if(action === 'addsub'){ Ev.addSiblingAfter(id); }
    else if(action === 'strike'){ Ev.toggleStrike(id); }
    else if(action === 'del'){
      confirmDeleteId = id;
      render();
      setTimeout(function(){
        if(confirmDeleteId === id){ confirmDeleteId = null; render(); }
      }, 3500);
    } else if(action === 'confirmdel'){
      Ev.deleteTask(id);
      confirmDeleteId = null;
    }
  });

  Ev.onChange(render);
})();
</script>
</body>
</html>
